<style>
:root{
  --azul:#164a98; --azul2:#006aea; --azul-h:#0f3a78; --celeste:#9cc8ff; --celeste-soft:#eaf2ff;
  --tinta:#1a2740; --tinta-2:#5d6b85; --tinta-3:#93a0b6;
  --fondo:#f5f7fb; --linea:#e4e9f2; --linea-2:#d6deea; --suave:#f3f6fb;
  --ok:#1f8a4c; --ok-soft:#e8f5ee; --error:#cf3b3b; --error-soft:#fcecec; --aviso:#9a6b00; --aviso-soft:#fff6e2;
  --school:#164a98;
  --sombra:0 12px 34px rgba(22,74,152,.10);
  --sombra-suave:0 1px 2px rgba(22,74,152,.05),0 4px 14px rgba(22,74,152,.05);
  --radio:14px;
  --t:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--t);color:var(--tinta);background:var(--fondo);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.4px}
a{color:var(--azul2);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--tinta)}
code{background:var(--celeste-soft);color:var(--azul);padding:1px 6px;border-radius:5px;font-size:12.5px}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sobre-titulo{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--tinta-3)}
.punto{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--school);flex:none}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:10px;padding:10px 18px;font-weight:600;font-size:13.5px;transition:.15s;white-space:nowrap;text-decoration:none!important;line-height:1.2}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .i{width:16px;height:16px}
.btn-primario{background:var(--azul2);color:#fff}
.btn-primario:hover:not(:disabled){background:var(--azul-h)}
.btn-suave{background:#fff;border-color:var(--linea);color:var(--tinta)}
.btn-suave:hover:not(:disabled){border-color:var(--celeste);color:var(--azul);background:#fbfdff}
.btn-texto{background:none;color:var(--tinta-2);padding:8px 10px}
.btn-texto:hover{background:var(--suave);color:var(--tinta)}
.btn-peligro{background:#fff;border-color:#f3d3d3;color:var(--error)}
.btn-peligro:hover{background:var(--error-soft)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn-lg{padding:12px 22px;font-size:14px}
.btn-icono{padding:8px;border-radius:9px;background:none;border:0;color:var(--tinta-2);display:inline-flex}
.btn-icono:hover:not(:disabled){background:var(--suave);color:var(--tinta)}
.btn-icono:disabled{opacity:.3;cursor:default}

/* Estructura con menú lateral */
#shell{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
#shell.sin-nav{display:block}
#shell.sin-nav .side,#shell.sin-nav .mobilebar{display:none}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--linea);display:flex;flex-direction:column;padding:22px 14px 16px;overflow-y:auto}
.side .brand{padding:0 10px 4px}
.side .brand img{height:34px;display:block}
.side .brand small{display:block;margin-top:10px;font-size:11.5px;color:var(--tinta-3);font-weight:600}
.esc-sel{display:flex;align-items:center;gap:10px;width:100%;margin:18px 0 6px;padding:10px 12px;border-radius:11px;border:1.5px solid var(--linea);background:#fbfcfe;text-align:left;transition:.15s;position:relative;overflow:hidden}
.esc-sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--school);transition:background .6s}
.esc-sel:hover{border-color:var(--celeste)}
.esc-sel span{min-width:0;flex:1}
.esc-sel small{display:block;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--tinta-3);font-weight:700}
.esc-sel b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.esc-sel .i{width:15px;height:15px;color:var(--tinta-3)}
.nav-sec{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--tinta-3);font-weight:700;padding:18px 12px 8px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:10px;color:var(--tinta-2);font-weight:600;font-size:13.5px;transition:.12s;text-align:left;margin-bottom:2px;background:none;border:0}
.nav-item:hover{background:var(--suave);color:var(--tinta)}
.nav-item.activo{background:var(--celeste-soft);color:var(--azul)}
.nav-item .cnt{margin-left:auto;background:var(--azul2);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px}
.side .enlaces{margin-top:auto;padding:14px 12px 10px;display:flex;flex-direction:column;gap:6px;font-size:12px}
.side .enlaces a,.side .enlaces button{color:var(--tinta-3);background:none;border:0;padding:0;text-align:left;font-size:12px;font-weight:500;display:flex;align-items:center;gap:7px}
.side .enlaces a:hover,.side .enlaces button:hover{color:var(--azul);text-decoration:none}
.side .enlaces .i{width:14px;height:14px}
.me{border-top:1px solid var(--linea);padding:14px 6px 0;display:flex;align-items:center;gap:10px}
.me .info{min-width:0;flex:1}
.me .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .em{font-size:11.5px;color:var(--tinta-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .btn-icono:hover{color:var(--error)}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--celeste-soft);color:var(--azul);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.avatar-wrap{position:relative;display:inline-flex}
.avatar-wrap .estado{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid #fff}
.avatar-wrap.expira .estado{background:#e0a100}
.avatar-wrap.caida .estado{background:var(--error)}
.content{min-width:0}
.mobilebar{display:none;align-items:center;gap:12px;height:58px;padding:0 14px;background:#fff;border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:40}
.mobilebar img{height:26px}
.scrim{display:none}
.banner{font-size:13px;border-bottom:1px solid}
.banner .in{max-width:1100px;margin:0 auto;padding:9px 36px;display:flex;gap:10px;align-items:center}
.banner.aviso{background:var(--aviso-soft);border-color:#f1e1b5;color:#6b4b00}
.banner.demo{background:var(--azul);border-color:var(--azul);color:#dbe7fb;text-align:center;font-size:12px}
main{max-width:1100px;margin:0 auto;padding:34px 36px 100px}
.angosto{max-width:820px}
@media(max-width:900px){
  #shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:60;width:276px;transform:translateX(-100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 60px rgba(8,26,58,.25)}
  .side.abierto{transform:none}
  .scrim.abierto{display:block;position:fixed;inset:0;background:rgba(20,34,60,.4);z-index:50}
  .mobilebar{display:flex}
  main{padding:24px 16px 100px}
  .banner .in{padding:9px 16px}
}
.tarjeta{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra-suave)}
.pantalla{animation:entra .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.volver{display:inline-flex;align-items:center;gap:6px;color:var(--tinta-3);font-weight:600;font-size:13px;background:none;border:0;padding:4px 0;margin-bottom:12px}
.volver:hover{color:var(--azul)}
.cabecera{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.cabecera h1{font-size:25px;font-weight:800;letter-spacing:-.6px}
.cabecera p{margin:5px 0 0;color:var(--tinta-2);font-size:14px;max-width:640px}

/* Acceso */
.acceso{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;background:var(--azul);position:relative;overflow:hidden}
.acceso::before,.acceso::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.acceso::before{width:560px;height:560px;background:var(--azul2);opacity:.18;top:-180px;right:-140px}
.acceso::after{width:380px;height:380px;background:var(--celeste);opacity:.14;bottom:-150px;left:-100px}
.acceso-caja{position:relative;z-index:1;width:100%;max-width:440px;background:#fff;border-radius:22px;padding:40px 36px 32px;box-shadow:0 30px 70px rgba(8,26,58,.35);animation:sube .5s cubic-bezier(.2,.8,.2,1)}
@keyframes sube{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.acceso-caja .logo{height:42px;display:block;margin:0 auto 22px}
.acceso-caja .ceja{text-align:center;text-transform:uppercase;letter-spacing:2.5px;font-size:10.5px;color:var(--azul2);font-weight:700;margin-bottom:10px}
.acceso-caja h1{font-size:22px;color:var(--azul);font-weight:800;text-align:center}
.acceso-caja .subt{color:var(--tinta-2);margin:8px 0 22px;font-size:14px;text-align:center}
.pie-acceso{position:relative;z-index:1;margin-top:20px;font-size:12px;color:#c9d9f3;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.pie-acceso a{color:#dbe7fb;font-weight:600}
.pasos-g{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:13.5px}
.pasos-g li{display:flex;gap:10px;align-items:flex-start}
.pasos-g .n{width:22px;height:22px;border-radius:50%;background:var(--celeste-soft);color:var(--azul);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.g-mock{margin-top:16px;border:1px solid #dadce0;border-radius:12px;background:#fff;overflow:hidden;font-size:12.5px;color:#3c4043;position:relative;text-align:left}
.g-mock .tag{position:absolute;top:9px;right:10px;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--aviso);background:var(--aviso-soft);padding:2px 8px;border-radius:20px}
.g-mock .cab{padding:13px 96px 10px 16px;border-bottom:1px solid #eee;font-weight:600;font-size:13px;color:#202124}
.g-mock .fila-g{display:flex;gap:10px;align-items:flex-start;padding:9px 16px;border-bottom:1px solid #f1f3f4}
.g-mock .fila-g:last-child{border-bottom:none}
.g-mock .todo{background:#eef4ff;font-weight:700;color:#1a3d7c;box-shadow:inset 3px 0 0 var(--azul2)}
.g-mock .caja-g{width:16px;height:16px;border-radius:3px;background:#1a73e8;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
.g-mock .caja-g svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none}
.g-mock .pista{margin-left:auto;font-size:11px;font-weight:800;color:var(--azul2);white-space:nowrap}
.permisos{border:1px solid var(--linea);border-radius:12px;margin-bottom:6px;text-align:left}
.permiso{display:flex;gap:12px;padding:12px 14px;font-size:13px;color:var(--tinta-2)}
.permiso+.permiso{border-top:1px solid var(--linea)}
.permiso svg{color:var(--azul2);margin-top:1px}
.permiso b{display:block;color:var(--tinta);font-weight:700;font-size:13.5px}
.permiso.falta svg{color:var(--error)}
.permiso.ok svg{color:var(--ok)}
.check-legal{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:18px 0;color:var(--tinta-2);cursor:pointer;text-align:left}
.check-legal input{width:17px;height:17px;margin-top:2px;accent-color:var(--azul2);flex:none}
.btn-google{width:100%;background:#fff;border:1.5px solid var(--linea);color:var(--tinta);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:11px;transition:.15s;box-shadow:var(--sombra-suave)}
.btn-google:hover:not(:disabled){border-color:var(--celeste);transform:translateY(-1px)}
.btn-google:disabled{opacity:.5;cursor:not-allowed}
.btn-google svg{width:19px;height:19px}
.yo{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--linea);border-radius:12px;margin-bottom:18px;text-align:left}
.yo .avatar{width:46px;height:46px;font-size:16px}
.yo b{display:block;font-weight:700}
.yo span{font-size:13px;color:var(--tinta-3)}
.alerta{display:flex;gap:11px;padding:12px 14px;border-radius:12px;font-size:13.5px;margin-bottom:16px;border:1px solid;text-align:left}
.alerta svg{margin-top:2px}
.alerta.error{background:var(--error-soft);color:#9b2c2c;border-color:#f3d3d3}
.alerta.aviso{background:var(--aviso-soft);color:#6b4b00;border-color:#f1e1b5}
.alerta.info{background:var(--celeste-soft);color:#173c73;border-color:#d3e4fb}
.alerta.ok{background:var(--ok-soft);color:#155232;border-color:#cbe8d7}
.nota{font-size:12.5px;color:var(--tinta-3)}

/* Escuelas y cortina */
.escuelas{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.escuela-card{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1.5px solid var(--linea);border-radius:12px;padding:16px;transition:.15s;box-shadow:var(--sombra-suave)}
.escuela-card:hover{border-color:var(--c);transform:translateY(-1px)}
.escuela-card .punto{width:11px;height:11px;background:var(--c)}
.escuela-card b{font-weight:700;font-size:14px;flex:1}
.escuela-card small{font-size:11px;color:var(--tinta-3);font-weight:700;letter-spacing:.06em}
#cortina{position:fixed;inset:0;z-index:200;background:var(--c,#164a98);clip-path:circle(0 at var(--x,50%) var(--y,50%));display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;pointer-events:none}
#cortina.abre{animation:abre .8s cubic-bezier(.7,0,.2,1) forwards}
#cortina.cierra{animation:cierra .5s ease forwards}
@keyframes abre{to{clip-path:circle(150% at var(--x,50%) var(--y,50%))}}
@keyframes cierra{from{clip-path:circle(150% at var(--x,50%) var(--y,50%));opacity:1}to{clip-path:circle(150% at var(--x,50%) var(--y,50%));opacity:0}}
#cortina img{height:54px;opacity:0;transform:translateY(6px);transition:all .45s .35s}
#cortina .pre{font-size:11px;letter-spacing:.25em;text-transform:uppercase;opacity:0;transition:opacity .45s .45s;margin-top:28px;font-weight:700}
#cortina .nom{font-size:34px;font-weight:800;letter-spacing:-.8px;margin-top:6px;opacity:0;transform:translateY(6px);transition:all .45s .5s;text-align:center;padding:0 20px}
#cortina.abre img,#cortina.abre .nom{opacity:1;transform:none}
#cortina.abre .pre{opacity:.85}
#cortina .sinc{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;transform:translateY(4px);transition:opacity .6s ease,transform .6s ease;font-size:13.5px;font-weight:600;letter-spacing:.2px}
#cortina .sinc.ver{opacity:.95;transform:none}
#cortina .sinc .barra{width:150px;height:3px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
#cortina .sinc .barra i{display:block;height:100%;width:0;background:#fff;border-radius:3px;transition:width 1.6s cubic-bezier(.4,0,.2,1)}
#cortina .sinc.ver .barra i{width:82%}
#cortina .sinc.listo .barra i{width:100%;transition-duration:.35s}
#cortina .sinc .txt{display:flex;align-items:center;gap:7px;animation:respira 2s ease-in-out infinite}
#cortina .sinc.listo .txt{animation:none}
#cortina .sinc .txt svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes respira{50%{opacity:.5}}
#shell:not(.sin-nav)::after{content:"";position:fixed;left:0;right:0;bottom:0;height:4px;background:var(--school);z-index:90;transition:background .6s;pointer-events:none}

/* Inicio */
.saludo{display:flex;align-items:center;gap:16px;margin-bottom:26px}
.saludo .avatar{width:52px;height:52px;font-size:18px}
.saludo h1{font-size:25px;font-weight:800;letter-spacing:-.6px}
.saludo .sobre-titulo{display:flex;align-items:center;gap:8px;color:var(--tinta-2);margin-bottom:3px}
.acciones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:34px}
.accion{display:flex;gap:14px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--linea);border-radius:var(--radio);padding:20px;transition:.15s;box-shadow:var(--sombra-suave)}
.accion:hover{border-color:var(--celeste);transform:translateY(-1px);box-shadow:var(--sombra)}
.accion .ico{width:42px;height:42px;border-radius:11px;background:var(--celeste-soft);display:flex;align-items:center;justify-content:center;color:var(--azul);flex:none}
.accion .ico svg{width:20px;height:20px}
.accion b{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin-bottom:3px}
.accion span{color:var(--tinta-2);font-size:13px;display:block}
.seccion-tit{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;min-height:34px}
.seccion-tit h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--tinta-3)}
.lista{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);overflow:hidden;box-shadow:var(--sombra-suave)}
.fila{display:flex;align-items:center;gap:14px;padding:13px 18px;width:100%;background:none;border:0;text-align:left}
.fila+.fila{border-top:1px solid var(--linea)}
button.fila:hover,label.fila:hover{background:#fafcff}
.fila .txt{flex:1;min-width:0}
.fila b{display:block;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .sec{font-size:12.5px;color:var(--tinta-3);display:flex;align-items:center;gap:6px}
.vacio{text-align:center;padding:34px 20px;color:var(--tinta-3);background:#fff;border:1.5px dashed var(--linea-2);border-radius:var(--radio);font-size:13.5px}
.etiqueta{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.etiqueta.ok{background:var(--ok-soft);color:#1a7a44}
.etiqueta.pend{background:#f0f2f6;color:var(--tinta-2)}
.etiqueta.error{background:var(--error-soft);color:#bd3838}
.etiqueta.rol{background:var(--celeste-soft);color:var(--azul)}
.borrador{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--linea);border-left:4px solid var(--azul2);border-radius:var(--radio);padding:12px 16px;margin:-8px 0 24px;font-size:13.5px;box-shadow:var(--sombra-suave)}
.borrador .esp{flex:1}

/* Vista simple (dirección y docentes) */
#shell.simple{display:block}
#shell.simple .side{display:none}
#shell.simple .mobilebar{display:flex;height:66px;padding:0 max(20px, calc((100% - 980px) / 2));border-bottom:1px solid var(--linea);position:sticky}
#shell.simple .mobilebar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--school);transition:background .6s}
#shell.simple #btn-menu{display:none}
#shell.simple .mobilebar img{height:32px}
.tb-esc,.tb-yo,#tb-salir{display:none}
#shell.simple .tb-esc{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:20px;border:1.5px solid var(--linea);background:#fff;font-weight:700;font-size:13px}
#shell.simple .tb-esc:not(:disabled):hover{border-color:var(--celeste)}
#shell.simple .tb-esc:disabled{cursor:default}
#shell.simple .tb-esc .i{width:14px;height:14px;color:var(--tinta-3)}
#shell.simple .tb-yo{display:inline-flex;align-items:center;gap:9px}
#shell.simple #tb-salir{display:inline-flex}
.tb-rol{font-size:12px;font-weight:600;color:var(--tinta-3)}
#shell.simple main{max-width:1000px}
#shell.simple .angosto{max-width:860px;margin:0 auto}
#shell.simple main:has(.dos-col) .angosto{max-width:1080px}
#shell.simple main:has(.dos-col){max-width:1140px}
.dos-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;align-items:start}
.dos-col .pm-filtros .buscador input{width:100%}
.dos-col .buscador{width:100%}
.chips-f{display:flex;flex-wrap:wrap;gap:6px}
.chips-f button{padding:5px 11px;border-radius:20px;border:1.5px solid var(--linea);background:#fff;font-weight:600;font-size:12px;color:var(--tinta-2)}
.chips-f button.sel{background:var(--azul2);border-color:var(--azul2);color:#fff}
.chips-f button .c{opacity:.7;margin-left:4px}
@media(max-width:900px){ .dos-col{grid-template-columns:1fr} }
#shell.simple .banner .in{max-width:980px}
.banner.vercomo{background:#1a2740;border-color:#1a2740;color:#dbe7fb}
.banner.vercomo .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
@media(max-width:640px){ .tb-rol{display:none} #shell.simple .tb-esc span{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} }
.acciones.grandes{grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:16px}
.accion.grande{flex-direction:column;gap:16px;padding:26px 24px;min-height:200px}
.accion.grande .ico{width:52px;height:52px;border-radius:14px}
.accion.grande .ico svg{width:24px;height:24px}
.accion.grande b{font-size:17px}
.accion.grande .ir{margin-top:auto;color:var(--azul2);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
@media(max-width:760px){ .acciones.grandes{grid-template-columns:1fr} .accion.grande{min-height:0} }
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:26px}
.kpi{text-align:left;background:#fff;border:1px solid var(--linea);border-radius:var(--radio);padding:18px 20px;box-shadow:var(--sombra-suave);transition:.15s}
.kpi:hover{border-color:var(--celeste);transform:translateY(-1px)}
.kpi .n{font-size:32px;font-weight:800;letter-spacing:-1px;color:var(--azul);line-height:1.1}
.kpi .l{font-size:12.5px;font-weight:600;color:var(--tinta-2);margin-top:4px}
.kpi.alerta-k .n{color:var(--error)}
@media(max-width:640px){ .kpis{grid-template-columns:1fr} }

/* Sugerencias */
.sug-btn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;margin:auto 0 8px;border-radius:10px;border:1.5px dashed #c9d6ea;color:var(--azul);font-weight:700;font-size:13px;transition:.12s;text-align:left;background:none}
.sug-btn:hover{background:var(--celeste-soft);border-color:var(--azul2)}
.sug-btn .q{width:24px;height:24px;border-radius:50%;background:var(--azul2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.sug-btn small{display:block;font-weight:500;color:var(--tinta-3);font-size:11.5px}
.side .enlaces{margin-top:0}
.tb-sug{display:none;width:34px;height:34px;border-radius:50%;border:1.5px dashed #c9d6ea;background:none;color:var(--azul2);font-weight:800;font-size:16px;align-items:center;justify-content:center}
.tb-sug:hover{background:var(--celeste-soft);border-color:var(--azul2)}
#shell.simple .tb-sug{display:inline-flex}
/* Plantilla Maestra en la vista de dirección */
.pm-filtros{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.pm-filtros .buscador input{width:340px;max-width:100%}
.az{display:flex;flex-wrap:wrap;gap:4px}
.az button{min-width:30px;height:30px;padding:0 8px;border-radius:8px;border:1.5px solid var(--linea);background:#fff;font-weight:700;font-size:12.5px;color:var(--tinta-2);transition:.12s}
.az button:hover:not(:disabled){border-color:var(--celeste);color:var(--azul)}
.az button.sel{background:var(--azul2);border-color:var(--azul2);color:#fff}
.az button:disabled{opacity:.3;cursor:default}
.paginador{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px 0;font-size:12.5px;color:var(--tinta-3)}
.paginador .botones{display:flex;gap:6px}
.cod{font-weight:800;color:var(--azul);font-size:12.5px;min-width:74px}

/* Formulario */
.pasos{display:flex;gap:8px;margin:0 0 20px}
.st{flex:1;display:flex;flex-direction:column;gap:9px;background:none;border:0;padding:0;text-align:left;color:var(--tinta-3);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.st .bar{height:4px;border-radius:9px;background:var(--linea);overflow:hidden;position:relative}
.st .bar::after{content:"";position:absolute;inset:0;background:var(--school);transform:scaleX(0);transform-origin:left;transition:transform .4s ease}
.st.hecho .bar::after,.st.activo .bar::after{transform:scaleX(1)}
.st.activo{color:var(--tinta)}
.st[disabled]{cursor:default}
.form-tarjeta{padding:30px 32px}
.form-tarjeta h2{font-size:19px;font-weight:800}
.form-tarjeta .intro{color:var(--tinta-2);margin:4px 0 2px;font-size:13.5px}
.campo{margin-top:20px}
.campo>label,.campo>.lab{display:block;font-size:11px;font-weight:700;color:var(--tinta-2);margin-bottom:7px;text-transform:uppercase;letter-spacing:.6px}
.campo .req{color:var(--tinta-3);font-weight:600;margin-left:4px;text-transform:none;letter-spacing:0}
.campo .ayuda{font-size:12.5px;color:var(--tinta-3);margin:-3px 0 8px}
.campo input[type=text],.campo input[type=url],.campo input[type=number],.campo input[type=email],.campo textarea,.campo select{width:100%;padding:11px 13px;border:1.5px solid var(--linea);border-radius:10px;background:#fbfcfe;transition:.15s;outline:none}
.campo textarea{resize:vertical;min-height:46px;line-height:1.5}
.campo input:focus,.campo textarea:focus,.campo select:focus{border-color:var(--azul2);background:#fff;box-shadow:0 0 0 3px rgba(0,106,234,.12)}
.campo.invalido input,.campo.invalido textarea,.campo.invalido select{border-color:var(--error);background:#fff}
.campo.invalido .op{border-color:#f3d3d3}
.campo .err{color:var(--error);font-size:12.5px;margin-top:6px;display:none;align-items:center;gap:6px;font-weight:600}
.campo.invalido .err{display:flex}
.opciones{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1.5px solid var(--linea);background:#fff;border-radius:10px;padding:9px 15px;font-weight:600;font-size:13.5px;color:var(--tinta-2);transition:.12s;display:inline-flex;align-items:center;gap:8px}
.op:hover{border-color:var(--celeste);color:var(--azul)}
.op.sel{border-color:var(--azul2);background:var(--celeste-soft);color:var(--azul)}
.op .marca{width:15px;height:15px;border-radius:4px;border:1.5px solid #b9c4d6;display:inline-flex;align-items:center;justify-content:center;background:#fff}
.op.sel .marca{background:var(--azul2);border-color:var(--azul2);color:#fff}
.op .marca svg{width:10px;height:10px;stroke-width:3.4}
.op.ancha{flex:1;min-width:210px;justify-content:flex-start;text-align:left;padding:12px 15px}
.op small{display:block;font-weight:500;color:var(--tinta-3);font-size:11.5px}
.sub{margin-top:10px;padding:14px;border-radius:12px;background:#fbfdff;border:1.5px solid var(--celeste-soft);display:grid;gap:12px;animation:entra .2s ease both}
.sub .campo{margin-top:0}
.escuela-fija{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:10px;background:var(--suave);font-weight:700;font-size:14px}
.pie-form{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:28px;padding-top:20px;border-top:1px solid var(--linea)}
.pie-form .guardado{font-size:12px;color:var(--tinta-3);display:flex;gap:6px;align-items:center}
.resumen-grupo{margin-top:22px}
.resumen-grupo .cab{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--linea)}
.resumen-grupo .cab span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--azul)}
.resumen-grupo dl{margin:0;display:grid;grid-template-columns:minmax(150px,30%) 1fr}
.resumen-grupo dt,.resumen-grupo dd{padding:9px 0;border-bottom:1px solid #eef2f7;margin:0;font-size:13.5px}
.resumen-grupo dt{color:var(--tinta-3);padding-right:16px;font-weight:600}
.resumen-grupo dd{white-space:pre-wrap;word-break:break-word}
.envio{margin-top:24px;padding:14px 16px;border-radius:12px;background:var(--celeste-soft);font-size:13.5px;color:#173c73}
.envio .dest{margin-bottom:10px;display:flex;gap:8px;align-items:flex-start}
.envio label{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:600}
.envio input{width:17px;height:17px;accent-color:var(--azul2)}

/* Éxito */
.exito{text-align:center;padding:44px 32px}
.exito .circulo{width:70px;height:70px;border-radius:50%;background:var(--school);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both;box-shadow:0 0 0 8px color-mix(in srgb,var(--school) 12%,white)}
.exito .circulo svg{width:32px;height:32px;stroke-width:2.6;stroke-dasharray:40;stroke-dashoffset:40;animation:traza .45s .3s ease forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes traza{to{stroke-dashoffset:0}}
.exito h1{font-size:25px;font-weight:800}
.exito p{color:var(--tinta-2);max-width:480px;margin:8px auto 0}
.exito .lista{max-width:520px;margin:24px auto 0;text-align:left}
.exito .botones{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}

/* Carga masiva */
.pasos-m{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.paso-m{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);padding:18px;box-shadow:var(--sombra-suave)}
.paso-m .num{width:24px;height:24px;border-radius:50%;background:var(--celeste-soft);color:var(--azul);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.paso-m b{display:block;margin:10px 0 4px;font-weight:700}
.paso-m span{font-size:13px;color:var(--tinta-2)}
.zona{border:1.5px dashed #c9d6ea;border-radius:var(--radio);background:#fff;padding:48px 20px;text-align:center;transition:.15s;cursor:pointer}
.zona:hover,.zona.sobre{border-color:var(--azul2);background:var(--celeste-soft)}
.zona svg{width:32px;height:32px;color:var(--azul2);margin-bottom:10px}
.zona b{display:block;font-weight:700}
.zona span{color:var(--tinta-3);font-size:13.5px}
.herr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.herr .esp{flex:1}
.segmento{display:inline-flex;background:#e9eef7;padding:4px;border-radius:11px;gap:2px}
.segmento button{border:0;background:none;padding:7px 13px;border-radius:8px;font-weight:600;font-size:13px;color:var(--tinta-2);display:flex;gap:6px;align-items:center}
.segmento button.sel{background:#fff;color:var(--azul);box-shadow:0 1px 3px rgba(22,74,152,.12)}
.segmento .i{width:15px;height:15px}
.buscador{position:relative}
.buscador input{padding:9px 12px 9px 36px;border:1.5px solid var(--linea);border-radius:10px;width:270px;outline:none;font-size:13.5px;background:#fff}
.buscador input:focus{border-color:var(--azul2)}
.buscador svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tinta-3);width:16px;height:16px}
select.filtro{padding:9px 12px;border:1.5px solid var(--linea);border-radius:10px;background:#fff;outline:none;max-width:230px;font-size:13.5px}

/* Tablas */
.tabla-wrap{background:#fff;border:1px solid var(--linea);border-radius:12px;overflow:auto;max-height:68vh;box-shadow:var(--sombra-suave)}
table.tabla{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tabla th{position:sticky;top:0;background:#f8fafd;text-align:left;font-weight:700;color:var(--tinta-2);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:11px 14px;border-bottom:1px solid var(--linea);white-space:nowrap;z-index:2}
.tabla td{padding:12px 14px;border-bottom:1px solid var(--linea);vertical-align:middle}
.tabla tbody tr:last-child td{border-bottom:0}
.tabla tbody tr{cursor:pointer}
.tabla tbody tr:hover td{background:#fafcff}
.tabla .nom{font-weight:700;min-width:220px}
.tabla .nw{white-space:nowrap}
.tabla.general td{min-width:160px;max-width:330px;vertical-align:top}
.tabla.general td .clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.tabla.general th:first-child,.tabla.general td:first-child{position:sticky;left:0;background:#fff;z-index:1;box-shadow:1px 0 0 var(--linea)}
.tabla.general th:first-child{z-index:3;background:#f8fafd}
.tabla tr.con-error td:first-child{box-shadow:inset 3px 0 0 var(--error)}
.mas{display:flex;justify-content:center;padding:14px}
.switch{position:relative;width:36px;height:21px;border-radius:99px;background:#d3dbe8;border:0;transition:background .2s;flex:none;padding:0}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(15px)}

/* Fichas */
.ficha-nav{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--linea);border-radius:12px;padding:8px 10px;margin-bottom:12px;flex-wrap:wrap;box-shadow:var(--sombra-suave)}
.ficha-nav .pos{font-weight:700;font-size:13.5px}
.ficha-nav .esp{flex:1}
.meta-ficha{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--tinta-3);margin-top:8px;align-items:center}
.meta-ficha b{color:var(--tinta-2);font-weight:700}
.bloque-tit{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--azul);margin:32px 0 -6px;padding-top:22px;border-top:1px solid var(--linea)}
.bloque-tit.primero{border-top:0;padding-top:0;margin-top:22px}
.pie-fijo{position:sticky;bottom:0;background:rgba(245,247,251,.94);backdrop-filter:blur(6px);padding:14px 0;margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5;border-top:1px solid var(--linea)}
.pie-fijo .esp{flex:1}

/* Equipo */
.equipo-grupo{margin-bottom:24px}
.equipo-grupo h2{font-size:14px;font-weight:700;display:flex;align-items:center;gap:9px;margin-bottom:10px}
.form-linea{display:grid;grid-template-columns:var(--cols, 1.3fr 1fr auto);gap:12px;align-items:end;padding:18px 20px;background:#fff;border:1px solid var(--linea);border-radius:var(--radio);margin-bottom:28px;box-shadow:var(--sombra-suave)}
.form-linea .campo{margin:0}
.form-linea .btn{height:44px}

/* Legal */
.legal{max-width:760px;margin:0 auto;padding:40px 24px 80px}
.legal .logo{height:36px;margin-bottom:28px}
.legal h1{font-size:28px;font-weight:800;color:var(--azul)}
.legal .fecha{color:var(--tinta-3);font-size:13.5px;margin:6px 0 30px}
.legal h2{font-size:12px;margin:30px 0 8px;text-transform:uppercase;letter-spacing:.8px;color:var(--azul)}
.legal p,.legal li{color:var(--tinta-2)}
.legal table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px;background:#fff}
.legal th,.legal td{border:1px solid var(--linea);padding:9px 12px;text-align:left;vertical-align:top}
.legal th{background:#f8fafd}
.legal .caja{background:#fff;border:1px solid var(--linea);border-left:4px solid var(--azul2);border-radius:10px;padding:14px 16px;margin:12px 0}

/* Modal, toast, espera */
.capa{position:fixed;inset:0;background:rgba(20,34,60,.45);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 30px 70px rgba(8,26,58,.3);animation:sube .25s cubic-bezier(.2,.8,.2,1)}
.modal.ancho{max-width:800px}
.modal .cab{display:flex;align-items:center;justify-content:space-between;padding:22px 26px 8px}
.modal .cab h2{font-size:18px;font-weight:800;color:var(--azul)}
.modal .cuerpo{padding:6px 26px 20px;overflow:auto;font-size:13.5px}
.modal .pie{display:flex;gap:10px;justify-content:flex-end;padding:14px 26px 18px;border-top:1px solid var(--linea);background:#fafbfd;border-radius:0 0 18px 18px;flex-wrap:wrap}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:300;align-items:center}
.toast{background:var(--tinta);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;box-shadow:0 10px 30px rgba(8,26,58,.25);display:flex;gap:10px;align-items:center;animation:sube .25s ease;max-width:90vw;font-weight:500}
.toast.error{background:#9b2c2c}
#espera{position:fixed;inset:0;background:rgba(245,247,251,.82);backdrop-filter:blur(2px);z-index:250;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-weight:600;color:var(--tinta-2);font-size:13.5px}
.giro{width:34px;height:34px;border-radius:50%;border:3px solid var(--celeste-soft);border-top-color:var(--azul2);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.cargando{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:18px;color:#c9d9f3;font-size:13.5px;background:var(--azul)}

@media (max-width:820px){ .pasos-m{grid-template-columns:1fr} .form-linea{grid-template-columns:1fr} }
@media (max-width:640px){
  .acciones{grid-template-columns:1fr}
  .form-tarjeta{padding:22px 18px}
  .acceso-caja{padding:30px 22px}
  .resumen-grupo dl{grid-template-columns:1fr}
  .resumen-grupo dt{border-bottom:0;padding-bottom:0}
  .buscador,.buscador input{width:100%}
  .pie-form{flex-wrap:wrap}
  .pie-form .guardado{order:3;width:100%}
}

/* Temporadas */
#cortina>*:not(.fiesta){position:relative;z-index:1}
#cortina .fiesta{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fiesta .cae{position:absolute;top:0;left:var(--l);will-change:transform;animation:cae var(--d) cubic-bezier(.42,0,.85,.55) var(--w) both}
@keyframes cae{from{transform:translate3d(0,-18vh,0)}to{transform:translate3d(var(--dx),112vh,0)}}
.fiesta .bola{display:block;width:var(--t);transform-origin:50% 0;animation:pendulo var(--p) ease-in-out infinite alternate;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
@keyframes pendulo{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.fiesta .copo{display:block;width:var(--t);height:var(--t);border-radius:50%;background:#fff;opacity:var(--o)}
.fiesta .confeti{display:block;width:var(--t);height:calc(var(--t) * .45);background:var(--k);border-radius:2px;animation:gira var(--p) linear infinite}
@keyframes gira{from{transform:rotate3d(1,.4,0,0deg)}to{transform:rotate3d(1,.4,0,360deg)}}
.fiesta .bandera{display:block;width:var(--t);height:calc(var(--t) * .6);border-radius:2px;background:linear-gradient(#002b7f 0 16.6%,#fff 0 33.3%,#ce1126 0 66.6%,#fff 0 83.3%,#002b7f 0);animation:ondea var(--p) ease-in-out infinite alternate;box-shadow:0 3px 8px rgba(0,0,0,.15)}
@keyframes ondea{from{transform:rotate(-18deg) skewY(-6deg)}to{transform:rotate(18deg) skewY(6deg)}}
.fiesta .chispa{position:absolute;left:var(--x);top:var(--y);width:0;height:0}
.fiesta .chispa i{position:absolute;left:-2px;top:-2px;width:4px;height:4px;border-radius:50%;background:var(--k);box-shadow:0 0 6px var(--k);opacity:0;animation:chispa 1.3s cubic-bezier(.2,.7,.3,1) var(--w) both}
@keyframes chispa{0%{opacity:1;transform:rotate(var(--a)) translateX(0)}70%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--r)) translateY(18px)}}
/* Correos con chips */
.chips-correo{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 8px;border:1.5px solid var(--borde,#dfe6f0);border-radius:12px;background:#fff;cursor:text;min-height:46px}
.chips-correo:focus-within{border-color:var(--azul2);box-shadow:0 0 0 3px var(--celeste-soft)}
.chips-correo .lista-c{display:contents}
.chip-c{display:inline-flex;align-items:center;gap:4px;background:var(--celeste-soft);color:var(--azul);border-radius:999px;padding:4px 6px 4px 11px;font-size:13px;font-weight:600}
.chip-c button{border:0;background:none;color:inherit;font-size:16px;line-height:1;width:20px;height:20px;border-radius:50%;cursor:pointer;opacity:.6}
.chip-c button:hover{opacity:1;background:rgba(22,74,152,.12)}
.chips-correo .vacio-c{font-size:13px;color:var(--tinta-3);padding:0 4px}
.chips-correo .nuevo-c{flex:1;min-width:190px;border:0!important;box-shadow:none!important;outline:0;padding:5px 4px!important;font:inherit;font-size:14px;background:transparent!important}
.chips-correo .add-c{flex:none}
.ayuda-c{margin:-2px 0 8px;font-size:12.5px;color:var(--tinta-3)}
.campo-c-acc{display:flex;justify-content:flex-end;margin-top:4px}
.campo-c-acc button{font-size:12px;color:var(--tinta-3)}
.correo-esc{border-top:1px solid #edf1f7;padding-top:6px;margin-top:10px}
.pref-fila{display:flex;align-items:flex-start;gap:14px;padding:14px 0}
.pref-fila b{display:block;font-size:15px}.pref-fila small{display:block;color:var(--tinta-3);font-size:13px;margin-top:3px;line-height:1.45}
.interruptor{position:relative;flex:none;width:46px;height:26px;margin-top:2px}
.interruptor input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0;z-index:1}
.interruptor span{position:absolute;inset:0;border-radius:999px;background:#cfd8e6;transition:background .2s}
.interruptor span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.interruptor input:checked+span{background:var(--azul2)}
.interruptor input:checked+span::after{transform:translateX(20px)}
.temp-prueba{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

function cargarScript(src){
  return new Promise((res, rej) => {
    const ya = $$('script').find(s => s.src === src);
    if(ya){ if(ya.dataset.ok) return res(); ya.addEventListener('load', () => res()); ya.addEventListener('error', rej); return; }
    const s = document.createElement('script'); s.src = src; s.async = true;
    s.onload = () => { s.dataset.ok = '1'; res(); }; s.onerror = () => rej(new Error('No se pudo cargar un componente. Revise su conexión.'));
    document.head.appendChild(s);
  });
}

function validarCurso(c, campos = TODOS){
  const e = {}; const t = v => String(v == null ? '' : v).trim(); const has = k => campos.includes(k);
  if(has('escuela') && !(S.boot ? S.boot.schools : []).some(s => s.nombre === c.escuela)) e.escuela = 'Seleccione una escuela válida.';
  if(has('asignaDCD')){ if(!['Sí','No'].includes(c.asignaDCD)) e.asignaDCD = 'Seleccione una opción.'; else if(c.asignaDCD === 'No' && !t(c.codigo)) e.asignaDCD = 'Escriba el código propuesto.'; }
  if(has('nombre') && !t(c.nombre)) e.nombre = 'Escriba el nombre del curso.';
  if(has('moneda') && !(c.moneda || []).length) e.moneda = 'Seleccione al menos una moneda.';
  if(has('modalidad') && !MODALIDADES.includes(c.modalidad)) e.modalidad = 'Seleccione la modalidad.';
  if(has('horas')){ if(!HORAS.includes(String(c.horas))) e.horas = 'Seleccione las horas lectivas.'; else if(c.horas === 'Otro' && !(Number(c.horasOtro) > 0)) e.horas = 'Indique la cantidad de horas.'; }
  if(has('descripcion') && !t(c.descripcion)) e.descripcion = 'Escriba la descripción.';
  if(has('nivel') && !NIVELES.includes(c.nivel)) e.nivel = 'Seleccione el nivel.';
  if(has('perfil') && !t(c.perfil)) e.perfil = 'Describa el perfil de ingreso.';
  TOGGLES.forEach(k => { if(has(k) && c[k + 'On'] && !t(c[k])) e[k] = 'Especifique el detalle o elija «Ninguno».'; });
  if(has('roles') && !t(c.roles)) e.roles = 'Indique al menos un rol.';
  if(has('palabras') && !t(c.palabras)) e.palabras = 'Indique al menos una palabra clave.';
  if(has('contenidos') && !t(c.contenidos)) e.contenidos = 'Escriba los contenidos principales.';
  if(has('cert')){
    if(!['Sí','No'].includes(c.cert)) e.cert = 'Seleccione una opción.';
    else if(c.cert === 'Sí' && (!t(c.certCasa) || !t(c.certLink))) e.cert = 'Complete la casa certificadora y el enlace.';
    else if(c.cert === 'Sí' && !/^https?:\/\//i.test(t(c.certLink))) e.cert = 'El enlace debe iniciar con https://';
  }
  if(has('programa') && t(c.programa) && !/^https?:\/\//i.test(t(c.programa))) e.programa = 'El enlace debe iniciar con https://';
  return e;
}
function valorVisible(k, c){
  const t = v => String(v == null ? '' : v).trim();
  switch(k){
    case 'asignaDCD': return c.asignaDCD === 'No' ? `Código propuesto: ${t(c.codigo).toUpperCase() || '—'}` : 'Lo asigna Desarrollo Curricular';
    case 'moneda': return (c.moneda || []).join(' y ') || '—';
    case 'horas': return c.horas === 'Otro' ? (c.horasOtro ? `${c.horasOtro} horas` : '—') : (c.horas ? `${c.horas} horas` : '—');
    case 'cert': return c.cert === 'Sí' ? `Sí · ${t(c.certCasa)}${c.certLink ? '\n' + t(c.certLink) : ''}` : 'No';
    default: return TOGGLES.includes(k) ? (c[k + 'On'] && t(c[k]) ? t(c[k]) : 'Ninguno') : (t(c[k]) || '—');
  }
}

function renderCampos(cont, c, keys, opts = {}){
  const onCambio = opts.onCambio || (() => {});
  cont.innerHTML = '';
  let primero = true;
  keys.forEach(k => {
    if(opts.bloques && opts.bloques[k]){ cont.insertAdjacentHTML('beforeend', `<div class="bloque-tit ${primero ? 'primero' : ''}">${esc(opts.bloques[k])}</div>`); primero = false; }
    cont.appendChild(crearCampo(k, CAMPOS[k], c, onCambio, opts));
  });
}
function crearCampo(k, def, c, onCambio, opts){
  const w = document.createElement('div'); w.className = 'campo'; w.dataset.campo = k;

function modal({ titulo, cuerpo, acciones = [], ancho = false, cerrable = true }){
  return new Promise(resolve => {
    const capa = document.createElement('div'); capa.className = 'capa';
    capa.innerHTML = `<div class="modal ${ancho ? 'ancho' : ''}" role="dialog" aria-modal="true"><div class="cab"><h2>${esc(titulo)}</h2>${cerrable ? `<button class="btn-icono" data-x aria-label="Cerrar">${icon('x')}</button>` : ''}</div><div class="cuerpo"></div><div class="pie"></div></div>`;
    const cu = $('.cuerpo', capa); if(typeof cuerpo === 'string') cu.innerHTML = cuerpo; else if(cuerpo) cu.appendChild(cuerpo);
    if(typeof activarCorreos === 'function') activarCorreos(cu);
    const pie = $('.pie', capa); if(!acciones.length) pie.remove();
    const cerrar = v => { capa.remove(); document.removeEventListener('keydown', tecla); resolve(v); };
    acciones.forEach(a => {
      const b = document.createElement('button'); b.className = 'btn ' + (a.clase || 'btn-suave'); b.innerHTML = a.html || esc(a.texto);
      b.addEventListener('click', async () => { if(a.accion){ const r = await a.accion(b); if(r === false) return; } cerrar(a.valor); });
      pie.appendChild(b);
    });
    const tecla = e => { if(e.key === 'Escape' && cerrable) cerrar(null); };
    document.addEventListener('keydown', tecla);
    if(cerrable){ $('[data-x]', capa).addEventListener('click', () => cerrar(null)); capa.addEventListener('mousedown', e => { if(e.target === capa) cerrar(null); }); }
    document.body.appendChild(capa);

}

let tokenClient = null, pendiente = null;
async function iniciarGIS(){
  if(tokenClient) return;
  await cargarScript(LIB.gis);
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CFG.CLIENT_ID, scope: SCOPES.join(' '), include_granted_scopes: true,
    callback: r => { const p = pendiente; pendiente = null; if(p) (r && r.error ? p.rej(r) : p.res(r)); },
    error_callback: e => { const p = pendiente; pendiente = null; if(p) p.rej(e); }
  });
}
const pedirToken = o => new Promise((res, rej) => { pendiente = { res, rej }; tokenClient.requestAccessToken(o); });
const faltantes = r => { const ot = String(r.scope || '').split(' '); return SCOPES.filter(s => s !== 'openid' && !ot.includes(s)); };
function guardarToken(r, email){
  S.token = r.access_token; S.exp = Date.now() + (Number(r.expires_in) || 3599) * 1000;
  ss.set(K.sesion, { token:S.token, exp:S.exp, email }); programarAviso();
}

async function conectar(modo){
  if(DEMO) return conectarDemo();
  try { await iniciarGIS(); } catch(e){ toast(e.message, 'error'); return; }
  const previo = ls.get(K.usuario);
  let r;
  try { r = await pedirToken(modo === 'nuevo' ? { prompt:'consent' } : { prompt:'', login_hint: previo && previo.email || undefined }); }
  catch(e){
    const t = e && (e.type || e.error);
    toast(t === 'popup_closed' ? 'Se cerró la ventana de Google antes de terminar.' : t === 'popup_failed_to_open' ? 'El navegador bloqueó la ventana de Google. Permita ventanas emergentes para este sitio.' : 'No se completó el inicio de sesión.', 'error', 6000);
    return;
  }
  const f = faltantes(r);
  if(f.length) return pantallaPermisos(f);
  try {
    const info = await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers:{ Authorization:'Bearer ' + r.access_token } })).json();
    if(!info.email) throw 0;
    S.user = { email: info.email.toLowerCase(), name: info.name || info.email, given: info.given_name || String(info.name || '').split(' ')[0], picture: info.picture || '' };
  } catch(e){ toast('No se pudo leer su perfil de Google.', 'error'); return; }
  ls.set(K.usuario, S.user); ls.set(K.consentimiento, true);
  guardarToken(r, S.user.email);
  cargarSistema();
}

let renovando = null;
function asegurarSesion(forzar){
  if(DEMO) return Promise.resolve();
  if(!forzar && S.token && Date.now() < S.exp - 60000) return Promise.resolve();
  if(renovando) return renovando;
  renovando = new Promise((resolve, reject) => {
    marcarSesion('caida');
    const u = S.user || ls.get(K.usuario) || {};
    modal({ titulo:'Su conexión con Google expiró', cerrable:false,
      cuerpo:`<div class="yo">${avatarHTML(u)}<div><b>${esc(u.name || '')}</b><span>${esc(u.email || '')}</span></div></div><p style="margin:0;color:var(--tinta-2)">Por seguridad, Google pide confirmar cada hora. Lo que estaba haciendo sigue aquí.</p>`,
      acciones:[
        { texto:'Cerrar sesión', clase:'btn-texto', valor:'salir' },
        { html:'Reconectar', clase:'btn-primario', valor:'ok', accion: async b => {
          b.disabled = true;
          try { await iniciarGIS(); const r = await pedirToken({ prompt:'', login_hint:u.email }); if(faltantes(r).length) throw 0; guardarToken(r, u.email); return true; }
          catch(e){ b.disabled = false; toast('No se pudo reconectar. Intente de nuevo.', 'error'); return false; }
        } }
      ] }).then(v => { renovando = null; if(v === 'salir'){ cerrarSesion(); reject(new Error('Sesión cerrada')); } else resolve(); });
  });
  return renovando;
}
let tAviso = null;
function programarAviso(){
  clearTimeout(tAviso); marcarSesion('ok'); $('#banner-sesion').hidden = true;

    const q = S.exp - Date.now();
    if(q <= 0){ marcarSesion('caida'); $('#banner-sesion-txt').textContent = 'La conexión con Google expiró. Renuévela para seguir guardando.'; $('#banner-sesion').hidden = false; return; }

    tAviso = setTimeout(rev, 30000);
  }, Math.max(0, S.exp - Date.now() - 5 * 60000));
}

const G = {
  async req(url, opts = {}, reintento = true){
    await asegurarSesion();
    let r;
    try { r = await fetch(url, Object.assign({}, opts, { headers: Object.assign({ Authorization:'Bearer ' + S.token, 'Content-Type':'application/json' }, opts.headers || {}) })); }
    catch(e){ throw new Error('Sin conexión. Revise su internet e intente de nuevo.'); }
    if(r.status === 401 && reintento){ await asegurarSesion(true); return G.req(url, opts, false); }
    const j = r.status === 204 ? {} : await r.json().catch(() => ({}));
    if(!r.ok){
      const m = j.error && j.error.message || ('Error ' + r.status);
      const e = new Error(r.status === 403 ? 'No tiene permiso para esta acción en la hoja de registros.' : r.status === 404 ? 'No se encontró la hoja de registros.' : m);
      e.status = r.status; e.detalle = m; throw e;
    }
    return j;
  },
  base: () => `https://sheets.googleapis.com/v4/spreadsheets/${CFG.SHEET_ID}`,
  meta: () => G.req(G.base() + '?fields=properties(title,timeZone),sheets(properties(sheetId,title,gridProperties(rowCount,columnCount)))'),
  async batchGet(rangos){
    const q = rangos.map(r => 'ranges=' + encodeURIComponent(r)).join('&');
    const j = await G.req(`${G.base()}/values:batchGet?${q}&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER`);
    return (j.valueRanges || []).map(v => v.values || []);
  },
  update: (rango, values) => G.req(`${G.base()}/values/${encodeURIComponent(rango)}?valueInputOption=RAW`, { method:'PUT', body: JSON.stringify({ values }) }),
  append: (rango, values) => G.req(`${G.base()}/values/${encodeURIComponent(rango)}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, { method:'POST', body: JSON.stringify({ values }) }),
  batch: requests => G.req(G.base() + ':batchUpdate', { method:'POST', body: JSON.stringify({ requests }) }),
  drive: (ruta, opts, id = CFG.SHEET_ID) => G.req('https://www.googleapis.com/drive/v3/files/' + id + ruta, opts),
  valores: data => G.req(G.base() + '/values:batchUpdate', { method:'POST', body: JSON.stringify({ valueInputOption:'RAW', data }) }),
  baseM: () => `https://sheets.googleapis.com/v4/spreadsheets/${CFG.SHEET_ID_MAESTRA}`,
  async gmail(correo, borrador){
    const b64 = s => { const by = new TextEncoder().encode(s); let bin = ''; by.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };
    const enc = s => '=?UTF-8?B?' + b64(s) + '?=';
    const lin = [`From: ${enc(S.user.name)} <${S.user.email}>`, `To: ${correo.to.join(', ')}`, correo.cc.length ? `Cc: ${correo.cc.join(', ')}` : null,
      `Subject: ${enc(correo.subject)}`, 'MIME-Version: 1.0', 'Content-Type: text/html; charset=UTF-8', 'Content-Transfer-Encoding: base64', '', b64(correo.html).replace(/.{76}/g, '$&\r\n')].filter(x => x !== null).join('\r\n');
    const raw = b64(lin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    if(borrador) await G.req('https://gmail.googleapis.com/gmail/v1/users/me/drafts', { method:'POST', body: JSON.stringify({ message:{ raw } }) });
    else await G.req('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', { method:'POST', body: JSON.stringify({ raw }) });
  }
};

function cursoAFila(c, m, ancho, ex){
  const t = v => String(v == null ? '' : v).trim(); const f = new Array(ancho).fill(''); const set = (i, v) => { if(i) f[i - 1] = v; };
  const mon = (c.moneda || []).filter(x => MONEDAS.includes(x));

  set(COL.codigo, c.asignaDCD === 'No' ? t(c.codigo).toUpperCase() : ''); set(COL.nombre, t(c.nombre)); set(COL.moneda, mon.join(', '));

  set(COL.descripcion, t(c.descripcion)); set(COL.nivel, t(c.nivel)); set(COL.perfil, t(c.perfil));

function filaACurso(f, ex, n){

const partesCodigo = cod => { const m = String(cod || '').toUpperCase().trim().match(/^([A-Z]+(?:-[A-Z]+)*)-(\d+)/); return m ? { prefijo: m[1], num: +m[2] } : null; };
/** Posición (índice de fila, 0 = encabezado) donde va un código para mantener el orden por código. */
function posicionCodigo(codigos, nuevo){
  const p = partesCodigo(nuevo); let ultimoMenor = -1, primero = -1;
  codigos.forEach((c, i) => { const q = partesCodigo(c); if(!q || q.prefijo !== p.prefijo) return; if(primero < 0) primero = i; if(q.num <= p.num) ultimoMenor = i; });
  if(ultimoMenor >= 0) return ultimoMenor + 2;
  if(primero >= 0) return primero + 1;
  let ultimo = codigos.length; while(ultimo > 0 && !String(codigos[ultimo - 1] || '').trim()) ultimo--;
  return ultimo + 1;
}
/** Sugerencias de código: colones en la serie 300 y dólares en la 600, según el prefijo de la escuela. */
function sugerirCodigos(prefijo, moneda, ocupados){
  const rango = moneda === 'Colones' ? [300, 599] : [600, 999];
  const nums = [...ocupados].map(partesCodigo).filter(q => q && q.prefijo === prefijo).map(q => q.num);
  const tomado = n => nums.includes(n);
  const enRango = nums.filter(n => n >= rango[0] && n <= rango[1]).sort((a, b) => a - b);
  const out = [];
  const add = (n, et) => { if(n >= rango[0] && n <= rango[1] && !tomado(n) && !out.some(o => o.num === n)) out.push({ num:n, codigo:`${prefijo}-${n}`, etiqueta:et }); };
  if(!enRango.length){ add(rango[0], 'Primer código de la serie'); return out; }
  // Cada bloque de códigos seguidos (separado por un salto grande) propone su siguiente número; el primero es el predeterminado
  const finales = enRango.filter((n, i) => i === enRango.length - 1 || enRango[i + 1] - n > 20);
  finales.forEach(fin => { let n = fin + 1; while(tomado(n)) n++; add(n, `Sigue a ${prefijo}-${fin}`); });
  let h = rango[0]; while(tomado(h)) h++; if(h < enRango[enRango.length - 1]) add(h, 'Espacio libre');
  return out.slice(0, 4);
}
function estadoDe(r){
  if(r.estado === 'Eliminado') return 'Eliminado';
  if(r.estado === 'Aprobado' || r.codigoAsignado) return r.notificado ? (/^borrador/i.test(r.notificado) ? 'Aviso en borrador' : 'Notificado') : 'Aprobado';
  if(r.estado === 'Con observaciones') return 'Con observaciones';
  if(r.included) return 'Incluido';
  return 'Pendiente';
}

Object.assign(Real, {

  },
  /** Inserta cada código en su lugar de la Plantilla Maestra conservando las fórmulas de la fila vecina. */
  async aprobar(r, items, estadoPM){
    const meta = await Real.maestraMeta();
    const hoja = meta.sheets.find(x => x.properties.title === CFG.HOJA_MAESTRA);
    if(!hoja) throw new Error(`La Plantilla Maestra no tiene la pestaña «${CFG.HOJA_MAESTRA}».`);
    const sid = hoja.properties.sheetId;
    const enc = await G.req(`${G.baseM()}/values/${encodeURIComponent(`'${CFG.HOJA_MAESTRA}'!1:1`)}`);
    const h = ((enc.values || [])[0] || []).map(v => norm(String(v).split('\n')[0]));
    const colDe = clave => h.findIndex(x => x.startsWith(clave));
    const cols = {}; Object.keys(MAESTRA_MAPA).forEach(k => { const i = colDe(MAESTRA_MAPA[k]); if(i >= 0) cols[k] = i; });
    if(cols.codigo == null) throw new Error('No se encontró la columna «Código» en la Plantilla Maestra.');
    const copiar = MAESTRA_COPIAR.filter(k => !(k === 'modalidad' && MODALIDADES.includes(r.modalidad))).map(colDe).filter(i => i >= 0);
    for(const item of items.slice().sort((a, b) => (partesCodigo(a.codigo).num - partesCodigo(b.codigo).num))){
      const codigos = await Real.maestraCodigos();
      if(codigos.some(c => { const q = partesCodigo(c), p = partesCodigo(item.codigo); return q && p && q.prefijo === p.prefijo && q.num === p.num; }))
        throw new Error(`El código ${item.codigo} ya existe en la Plantilla Maestra.`);
      const pos = posicionCodigo(codigos, item.codigo);
      const vecina = pos > 1 ? pos - 1 : pos;              // fila modelo antes de insertar
      const modelo = pos > 1 ? vecina : pos + 1;           // fila modelo después de insertar
      const fr = await G.req(`${G.baseM()}/values/${encodeURIComponent(`'${CFG.HOJA_MAESTRA}'!A${vecina + 1}:${letra(Math.max(h.length, 1))}${vecina + 1}`)}?valueRenderOption=FORMULA`);
      const formulas = ((fr.values || [])[0] || []).map(v => typeof v === 'string' && v.startsWith('='));
      const v = valoresMaestra(r, item, estadoPM);
      const reqs = [
        { insertDimension:{ range:{ sheetId:sid, dimension:'ROWS', startIndex:pos, endIndex:pos + 1 }, inheritFromBefore: pos > 1 } },
        { copyPaste:{ source:{ sheetId:sid, startRowIndex:modelo, endRowIndex:modelo + 1 }, destination:{ sheetId:sid, startRowIndex:pos, endRowIndex:pos + 1 }, pasteType:'PASTE_NORMAL' } }
      ];
      const porCol = {}; Object.keys(cols).forEach(k => porCol[cols[k]] = v[k]);
      for(let ci = 0; ci < h.length; ci++){
        if(formulas[ci] || copiar.includes(ci)) continue;
        const val = porCol[ci];
        const cell = val === undefined || val === '' ? {} : typeof val === 'number' ? { userEnteredValue:{ numberValue:val } } : { userEnteredValue:{ stringValue:String(val) } };
        reqs.push({ updateCells:{ start:{ sheetId:sid, rowIndex:pos, columnIndex:ci }, rows:[{ values:[cell] }], fields:'userEnteredValue' } });
      }
      await sinFiltro(G.baseM(), sid, reqs, 1);
    }
    const cambios = { included:true, estado:'Aprobado', codigoAsignado: items.map(i => i.codigo).join(', '), revisadoPor: S.user.email, fechaRevision: fechaTexto(new Date()) };
    await Real.marcar(r, cambios);
    Real.bitacora('Aprobó y pasó a la Plantilla Maestra', r.id + ' → ' + cambios.codigoAsignado + ' ' + r.nombre);
    return cambios;
  },
  async maestraCursos(){
    await Real.maestraMeta();
    const j = await G.req(`${G.baseM()}/values:batchGet?ranges=${encodeURIComponent(`'${CFG.HOJA_MAESTRA}'!A1:AI`)}&valueRenderOption=FORMATTED_VALUE`);
    const filas = (j.valueRanges[0] || {}).values || [];
    const h = (filas[0] || []).map(v => norm(String(v).split('\n')[0]));
    const c = k => h.findIndex(x => x.startsWith(k));
    const ix = { escuela:c('escuela'), codigo:c('codigo'), nombre:c('nombre del curso'), estado:c('estado del curso'), horas:c('num. horas clase'), moneda:c('moneda'), nivel:c('nivel de complejidad'), desc:c('descripcion larga') };
    return filas.slice(1).filter(f => f[ix.codigo]).map(f => { const o = {}; Object.keys(ix).forEach(k => o[k] = ix[k] >= 0 ? String(f[ix[k]] == null ? '' : f[ix[k]]).trim() : ''); return o; });
  },
  async guardarClaves(hoja, pares){
    const [filas] = await G.batchGet([`'${hoja}'!A2:A`]);
    const claves = filas.map(f => String(f[0] || '').trim());

    Object.keys(pares).forEach(k => { const i = claves.indexOf(k); if(i >= 0) data.push({ range:`'${hoja}'!B${i + 2}`, values:[[pares[k]]] }); else nuevas.push([k, pares[k]]); });
    if(data.length) await G.valores(data);
    if(nuevas.length) await G.append(`'${hoja}'!A:B`, nuevas);
  },
  guardarConfig: pares => Real.guardarClaves(HOJA.config, pares).then(() => Real.bitacora('Cambió la configuración', Object.keys(pares).join(', '))),
  guardarCorreos: pares => Real.guardarClaves(HOJA.correos, pares).then(() => Real.bitacora('Cambió las plantillas de correo', Object.keys(pares).join(', '))),
  async guardarEscuelas(lista){

    const filas = lista.map(e => [e.nombre, e.color, e.prefijo, e.activa ? 'Sí' : 'No', (e.correos || []).join(', ')]);

    }));
    if(reqs.length) await G.batch(reqs).catch(() => {});
  },
  async compartirAdmins(){}
});

/** Ejecuta cambios con el filtro de la hoja retirado y lo vuelve a poner igual en la misma operación (Sheets no copia filas en un rango filtrado). */
async function sinFiltro(base, sheetId, requests, filasNuevas = 0){
  const j = await G.req(base + '?fields=sheets(properties(sheetId),basicFilter)');
  const hoja = (j.sheets || []).find(x => x.properties.sheetId === sheetId) || {};
  const f = hoja.basicFilter;
  if(!f) return G.req(base + ':batchUpdate', { method:'POST', body: JSON.stringify({ requests }) });
  const filtro = { range: Object.assign({}, f.range) };
  if(filtro.range.endRowIndex != null) filtro.range.endRowIndex += filasNuevas;
  if(f.sortSpecs) filtro.sortSpecs = f.sortSpecs;
  if(f.filterSpecs && f.filterSpecs.length) filtro.filterSpecs = f.filterSpecs; else if(f.criteria) filtro.criteria = f.criteria;
  return G.req(base + ':batchUpdate', { method:'POST', body: JSON.stringify({ requests: [{ clearBasicFilter:{ sheetId } }].concat(requests, [{ setBasicFilter:{ filter: filtro } }]) }) });
}

const TEMPORADAS = [
  ['anio-nuevo', 'Año nuevo', [12, 26], [2, 2]],
  ['patrio', 'Mes patrio', [9, 1], [9, 15]],
  ['navidad', 'Navidad', [11, 1], [12, 25]],

const MESES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const rangoTemp = t => `${t[2][1]} ${MESES_C[t[2][0] - 1]} – ${t[3][1]} ${MESES_C[t[3][0] - 1]}`;
function temporadaHoy(d = new Date()){
  const forz = new URLSearchParams(location.search).get('temporada');
  if(forz){ const t = TEMPORADAS.find(x => x[0] === forz); if(t) return t; }
  const n = (d.getMonth() + 1) * 100 + d.getDate();
  return TEMPORADAS.find(([, , a, b]) => { const x = a[0] * 100 + a[1], y = b[0] * 100 + b[1]; return x <= y ? n >= x && n <= y : n >= x || n <= y; }) || null;
}
const clavePref = () => 'dcd_pref_' + (S.user ? S.user.email : '');
const prefs = () => Object.assign({ temporada:true }, ls.get(clavePref()) || {});
const azar = (a, b) => a + Math.random() * (b - a);
const unoDe = l => l[Math.floor(Math.random() * l.length)];
function bolaSVG(c){

    <rect x="15" y="13" width="10" height="7" rx="1.5" fill="#d9b64a"/><rect x="15" y="15.5" width="10" height="1.4" fill="#b8932c"/>
    <defs><radialGradient id="${id}" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".25" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".82"/></radialGradient></defs>
    <circle cx="20" cy="40" r="19" fill="url(#${id})"/><path d="M4 37 Q20 44 36 37" stroke="rgba(255,255,255,.45)" stroke-width="1.6" fill="none"/></svg>`;
}
function pintarTemporada(capa, t){

    for(let i = 0; i < 22; i++) cae(bolaSVG(unoDe(col)), azar(-2, 96), azar(2.6, 4.2), azar(0, 1.4), azar(-30, 30), `--t:${azar(24, 50).toFixed(0)}px;--p:${azar(.9, 1.6).toFixed(2)}s`);
    for(let i = 0; i < 40; i++) cae('<i class="copo"></i>', azar(0, 100), azar(3.5, 6), azar(0, 1.8), azar(-40, 40), `--t:${azar(3, 7).toFixed(1)}px;--o:${azar(.35, .8).toFixed(2)}`);
  } else if(t[0] === 'anio-nuevo'){

    for(let i = 0; i < 46; i++) cae('<i class="confeti"></i>', azar(0, 100), azar(2.8, 4.6), azar(0, 1.6), azar(-60, 60), `--t:${azar(8, 14).toFixed(0)}px;--k:${unoDe(col)};--p:${azar(.7, 1.4).toFixed(2)}s`);

      h.push(`<span class="chispa" style="--x:${azar(10, 90).toFixed(0)}%;--y:${azar(10, 55).toFixed(0)}%">${Array.from({ length:14 }, (_, n) => `<i style="--a:${n * 360 / 14}deg;--k:${k};--w:${w}s;--r:${r}px"></i>`).join('')}</span>`);
    }

}

/** Animación de entrada: se llena la pantalla con el color, se sincroniza y se abre la vista. */
async function animarEntrada(color, pre, nombre, ev, tarea, alFinal, temp){
  const cort = $('#cortina'), sinc = $('.sinc', cort), txt = $('.txt', sinc);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ await tarea.catch(() => {}); alFinal(); return; }
  pintarTemporada($('.fiesta', cort), temp !== undefined ? temp : (prefs().temporada ? temporadaHoy() : null));
  cort.style.setProperty('--x', (ev ? ev.clientX : innerWidth / 2) + 'px'); cort.style.setProperty('--y', (ev ? ev.clientY : innerHeight / 2) + 'px'); cort.style.setProperty('--c', color);
  $('.pre', cort).textContent = pre; $('.nom', cort).textContent = nombre;
  sinc.className = 'sinc'; txt.textContent = 'Estamos preparando todo para usted';
  cort.className = ''; void cort.offsetWidth; cort.className = 'abre';
  await sleep(1000);
  sinc.classList.add('ver');
  await Promise.all([sleep(1500), tarea.catch(() => {})]);
  sinc.classList.add('listo');
  txt.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>Todo listo';
  alFinal();
  await sleep(800);
  cort.className = 'cierra'; await sleep(520); cort.className = ''; $('.fiesta', cort).innerHTML = '';
}

let PM_CACHE = null;
async function pintarCursosMaestra(){
  const cont = $('#pm'); if(!cont) return;
  let todos;
  try { if(!PM_CACHE) PM_CACHE = await Almacen().maestraCursos(); todos = PM_CACHE; }
  catch(e){
    cont.innerHTML = `<div class="vacio">${e.code === 'SIN_MAESTRA' ? 'Por ahora no se pudo abrir la Plantilla Maestra. Desarrollo Curricular puede revisar el acceso.' : esc(e.message)}</div>`;
    return;
  }
  const esc_ = S.school ? S.school.nombre : '', pre = S.school ? S.school.prefijo : '';
  const mios = todos.filter(c => c.escuela === esc_ || (partesCodigo(c.codigo) || {}).prefijo === pre).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  const st = cont._st || (cont._st = { q:'', letra:'', pag:0 });
  const inicial = c => norm(c.nombre).replace(/[^a-z0-9]/g, '').charAt(0).toUpperCase();
  const letras = new Set(mios.map(inicial));
  const pintar = () => {
    const q = norm(st.q);
    const lista = mios.filter(c => (!st.letra || inicial(c) === st.letra) && (!q || norm(c.codigo + ' ' + c.nombre).includes(q)));
    const filtrado = st.letra || q;
    const porPag = 5, paginas = Math.max(1, Math.ceil(lista.length / porPag));
    st.pag = Math.min(st.pag, paginas - 1);
    const vis = filtrado ? lista.slice(0, 60) : lista.slice(st.pag * porPag, st.pag * porPag + porPag);
    $('#pm-lista').innerHTML = vis.length ? `<div class="lista">${vis.map(c => `<div class="fila"><span class="cod">${esc(c.codigo)}</span><div class="txt"><b>${esc(c.nombre)}</b><span class="sec">${esc([c.horas && c.horas + ' h', c.moneda, c.nivel].filter(Boolean).join(' · '))}</span></div><span class="etiqueta ${/inactiv/i.test(c.estado) ? 'pend' : 'ok'}">${esc(c.estado ? c.estado.charAt(0) + c.estado.slice(1).toLowerCase() : '—')}</span></div>`).join('')}</div>`
      : '<div class="vacio">No hay cursos con ese filtro.</div>';
    $('#pm-pie').innerHTML = filtrado ? `<span>${lista.length} curso(s)${lista.length > 60 ? ' · mostrando 60' : ''}</span><span></span>`
      : `<span>${mios.length} cursos · página ${st.pag + 1} de ${paginas}</span><span class="botones"><button class="btn btn-sm btn-suave" id="pm-ant" ${st.pag === 0 ? 'disabled' : ''}>${icon('izq')}Anterior</button><button class="btn btn-sm btn-suave" id="pm-sig" ${st.pag >= paginas - 1 ? 'disabled' : ''}>Siguiente${icon('der')}</button></span>`;
    if($('#pm-ant')) $('#pm-ant').addEventListener('click', () => { st.pag--; pintar(); });
    if($('#pm-sig')) $('#pm-sig').addEventListener('click', () => { st.pag++; pintar(); });
    $$('.az button', cont).forEach(b => b.classList.toggle('sel', b.dataset.l === st.letra));
  };
  cont.innerHTML = `<div class="pm-filtros"><div class="buscador">${icon('buscar')}<input type="search" id="pm-q" placeholder="Buscar por código o nombre" value="${esc(st.q)}"></div>
    <div class="az"><button data-l="">Todos</button>${'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('').map(l => `<button data-l="${l}" ${letras.has(l) ? '' : 'disabled'}>${l}</button>`).join('')}</div></div>
    <div id="pm-lista"></div><div class="paginador" id="pm-pie"></div>`;
  $$('.az button', cont).forEach(b => b.addEventListener('click', () => { st.letra = b.dataset.l; st.pag = 0; pintar(); }));
  let t; $('#pm-q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { st.q = e.target.value; st.pag = 0; pintar(); }, 200); });
  pintar();
}

function construirCorreo(cursos, fecha, copia){

  const v = { nombre:S.user.name, correo:S.user.email, escuela:escuelas.join(', '), cantidad:String(cursos.length), fecha: fecha.toLocaleString('es-CR', { dateStyle:'long', timeStyle:'short' }), cursos: cursos.map(c => c.nombre).join(', ') };

  const msj = rel(cfg.MENSAJE_DEL_CORREO || 'Hola:\n\n{nombre} ({correo}) registró {cantidad} curso(s) de la escuela de {escuela} el {fecha}.');
  const fila = (k, x) => `<tr><td style="padding:5px 14px 5px 0;color:#8a92a3;font-size:12px;white-space:nowrap;vertical-align:top">${k}</td><td style="padding:5px 0;font-size:13px;color:#141b2b">${x}</td></tr>`;

  const html = `<div style="background:#f6f7f9;padding:28px 12px;font-family:Arial,Helvetica,sans-serif"><div style="max-width:600px;margin:0 auto;background:#fff;border:1px solid #e5e8ee;border-radius:12px;overflow:hidden">

    <p style="margin:16px 0 0"><a href="https://docs.google.com/spreadsheets/d/${CFG.SHEET_ID}/edit" style="color:#164a98;font-size:13px;font-weight:600">Abrir la hoja de registros →</a></p>

  const to = S.boot.to.length ? S.boot.to.slice() : [S.user.email];

   COMPROBANTE PDF
   ========================================================================= */
async function generarPDF(regs, fechaIso){
  espera('Generando el comprobante…');
  try {
    await cargarScript(LIB.jspdf); await cargarScript(LIB.autotable);
    const doc = new window.jspdf.jsPDF({ unit:'mm', format:'letter' });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    const hex = h => { const m = String(h).replace('#', ''); return [0, 2, 4].map(i => parseInt(m.slice(i, i + 2), 16)); };
    const acento = hex(colorDe(regs[0].escuela));
    const enc = () => {
      doc.setFillColor(22, 74, 152); doc.rect(0, 0, W, 28, 'F'); doc.setFillColor(...acento); doc.rect(0, 28, W, 1.2, 'F');
      doc.addImage(LOGO_BLANCO, 'PNG', 14, 7, 33, 14);
      doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text('COMPROBANTE DE REGISTRO', W - 14, 14, { align:'right' });
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(210, 225, 250); doc.text('Desarrollo Curricular y Docente · Asignación de código a microcursos', W - 14, 19.5, { align:'right' });
    };
    enc();
    const fecha = fechaIso ? new Date(fechaIso) : new Date();
    doc.autoTable({ startY:36, theme:'plain', margin:{ left:14, right:14 }, styles:{ fontSize:9.5, cellPadding:{ top:1.3, bottom:1.3, left:0, right:4 }, textColor:[20, 27, 43] },
      columnStyles:{ 0:{ textColor:[138, 146, 163], cellWidth:36 } },
      body:[['Registrado por', regs[0].registradoPor || S.user.name], ['Correo', regs[0].correo || S.user.email], ['Fecha', fecha.toLocaleString('es-CR', { dateStyle:'long', timeStyle:'short' })], ['Cursos', String(regs.length)]] });
    regs.forEach((c, i) => {
      let y = doc.lastAutoTable.finalY + 10;
      if(y > H - 50){ doc.addPage(); enc(); y = 40; }
      const col = hex(colorDe(c.escuela));
      doc.setFillColor(...col); doc.circle(15.2, y - 2.1, 1.2, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(7.8); doc.setTextColor(138, 146, 163);
      doc.text(`${i + 1} · ${String(c.escuela).toUpperCase()}${c.id ? '   ·   ' + c.id : ''}`, 18.5, y - 1.2);
      doc.setFontSize(13); doc.setTextColor(20, 27, 43);
      const tit = doc.splitTextToSize(String(c.nombre || ''), W - 28); doc.text(tit, 14, y + 5);
      doc.autoTable({ startY: y + 3.5 + tit.length * 5.5, theme:'grid', margin:{ left:14, right:14, top:36 }, rowPageBreak:'avoid',
        styles:{ fontSize:8.8, cellPadding:2.6, lineColor:[229, 232, 238], lineWidth:.2, textColor:[20, 27, 43], valign:'top' },
        columnStyles:{ 0:{ cellWidth:48, textColor:[75, 84, 102], fillColor:[250, 251, 252] } },
        body: TODOS.filter(k => k !== 'escuela' && k !== 'nombre').map(k => [CAMPOS[k].label, valorVisible(k, c)]) });
    });
    const np = doc.internal.getNumberOfPages();
    for(let p = 1; p <= np; p++){
      doc.setPage(p); if(p > 1) enc();
      doc.setFontSize(7.5); doc.setTextColor(138, 146, 163); doc.setFont('helvetica', 'normal');
      doc.text('Universidad CENFOTEC · Comprobante de los datos registrados.', 14, H - 8); doc.text(`Página ${p} de ${np}`, W - 14, H - 8, { align:'right' });
    }
    const base = regs.length === 1 ? String(regs[0].nombre) : `${regs.length}_cursos`;
    doc.save(`Comprobante_${norm(base).replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 60)}_${fecha.toISOString().slice(0, 10)}.pdf`);
  } catch(e){ toast('No se pudo generar el PDF: ' + e.message, 'error'); }
  finally { finEspera(); }
}

async function descargarPlantilla(){

    const wb = new ExcelJS.Workbook(); wb.creator = 'DCD · Universidad CENFOTEC';
    const ws = wb.addWorksheet('Cursos', { views:[{ state:'frozen', ySplit:1 }] });

    const listas = { escuelas: S.boot.schools.map(s => s.nombre), sino:['Sí','No'], monedas:['Dólares','Colones','Dólares y Colones'], niveles:NIVELES, modalidades:MODALIDADES };
    const ref = {};
    Object.keys(listas).forEach((k, ci) => { const L = letra(ci + 1); listas[k].forEach((v, r) => li.getCell(`${L}${r + 1}`).value = v); ref[k] = `Listas!$${L}$1:$${L}$${listas[k].length}`; });
    ws.columns = COLS_X.map(c => ({ header: c.h, key: c.key, width: c.w }));
    const cab = ws.getRow(1); cab.height = 32;
    cab.eachCell((cell, n) => { const c = COLS_X[n - 1];
      cell.font = { bold:true, color:{ argb:'FFFFFFFF' }, name:'Arial', size:10 }; cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb: c.req ? 'FF164A98' : 'FF6E8BB8' } };
      cell.alignment = { vertical:'middle', horizontal:'center', wrapText:true }; if(c.nota) cell.note = c.nota; });
    for(let r = 2; r <= 301; r++) COLS_X.forEach((c, i) => {
      const cell = ws.getCell(r, i + 1); cell.alignment = { vertical:'top', wrapText:true };
      if(c.lista) cell.dataValidation = { type:'list', allowBlank:true, formulae:[ref[c.lista]], showErrorMessage:true, error:'Elija una opción de la lista.' };
      if(c.key === 'horas') cell.dataValidation = { type:'whole', operator:'greaterThan', allowBlank:true, formulae:[0], showErrorMessage:true, error:'Escriba un número entero de horas.' };
    });
    const ins = wb.addWorksheet('Instrucciones');
    ins.columns = [{ header:'Columna', width:30 }, { header:'Obligatoria', width:12 }, { header:'Qué escribir', width:70 }];
    COLS_X.forEach(c => ins.addRow([c.h, c.req ? 'Sí' : 'No', c.nota || (CAMPOS[c.key] && CAMPOS[c.key].ayuda) || '']));
    ins.getRow(1).eachCell(cell => { cell.font = { bold:true, color:{ argb:'FFFFFFFF' } }; cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF164A98' } }; });
    ins.eachRow((row, n) => { if(n > 1) row.alignment = { vertical:'top', wrapText:true }; });
    ins.addRow([]); ins.addRow(['Escriba un curso por fila en la hoja «Cursos» y no cambie los encabezados. Encabezado azul oscuro = obligatorio.']);
    const buf = await wb.xlsx.writeBuffer();
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    a.download = 'Plantilla_registro_microcursos.xlsx'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch(e){ toast('No se pudo crear la plantilla: ' + e.message, 'error'); }
  finally { finEspera(); }
}
$('#archivo').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if(f) leerExcel(f); });
async function leerExcel(archivo){
  if(!/\.xlsx?$/i.test(archivo.name)){ toast('Use un archivo de Excel (la plantilla descargada).', 'error'); return; }
  espera('Leyendo el archivo…');
  try {
    await cargarScript(LIB.sheetjs);
    const wb = XLSX.read(await archivo.arrayBuffer(), { type:'array', cellDates:true });
    const hoja = wb.SheetNames.find(n => norm(n) === 'cursos') || wb.SheetNames[0];
    const filas = XLSX.utils.sheet_to_json(wb.Sheets[hoja], { header:1, defval:'', raw:false, blankrows:false });
    const mapa = {};
    (filas[0] || []).forEach((v, n) => { const h = norm(String(v).replace(/\*/g, '')); const c = COLS_X.find(x => norm(x.h) === h) || COLS_X.find(x => h && h.startsWith(norm(x.h))); if(c) mapa[n] = c.key; });
    if(!Object.values(mapa).includes('nombre')) throw new Error('No se encontró la columna «Nombre del curso». Use la plantilla descargada.');
    const cursos = [];
    filas.slice(1).forEach(f => {
      const cr = {}; Object.keys(mapa).forEach(n => cr[mapa[n]] = String(f[n] == null ? '' : f[n]).trim());
      if(Object.keys(cr).some(k => k !== 'escuela' && cr[k])) cursos.push(cursoDesdeFila(cr));
    });
    if(!cursos.length) throw new Error('El archivo no tiene cursos en la hoja «Cursos».');
    if(cursos.length > 100) throw new Error(`El archivo tiene ${cursos.length} cursos; el máximo por envío es 100.`);
    S.bulk = { cursos, vista:'lista', idx:0, archivo: archivo.name };
    pintarMasivo();
  } catch(e){ toast(e.message, 'error', 6000); }
  finally { finEspera(); }
}
