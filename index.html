/** Dibuja, para cada curso y moneda, el campo del código con sugerencias. Devuelve la lista de ítems editables. */
function panelCodigos(zona, cursos){
  const items = [];
  cursos.forEach(r => (r.moneda.length ? r.moneda : ['Dólares']).forEach(m => items.push({ r, moneda:m, codigo:'' })));
  const pintar = () => {
    const ocupados = new Set((MAESTRA || []).concat(items.map(i => i.codigo).filter(Boolean)));
    const enSerie = (cod, moneda) => { const q = partesCodigo(cod); return q && (moneda === 'Colones' ? q.num >= 300 && q.num < 600 : q.num >= 600); };
    zona.innerHTML = `<div class="bloque-tit primero">Código en la Plantilla Maestra</div>
      ${!MAESTRA ? '<p class="nota" style="margin:14px 0 0">Conecte la Plantilla Maestra para ver sugerencias y validar códigos.</p>' : ''}
      ${items.map((it, k) => {
        const pre = prefijo(it.r.escuela);
        const sug = MAESTRA ? sugerirCodigos(pre, it.moneda, new Set([...ocupados].filter(c => c !== it.codigo))) : [];
        const prop = String(it.r.codigo || '').toUpperCase().trim();
        if(it.r.asignaDCD === 'No' && prop && enSerie(prop, it.moneda) && !sug.some(s => s.codigo === prop)) sug.unshift({ codigo: prop, etiqueta:'Propuesto por la escuela' });
        if(!it.codigo && sug.length){ it.codigo = (sug.find(x => !ocupados.has(x.codigo)) || sug[0]).codigo; ocupados.add(it.codigo); }
        const dup = MAESTRA && it.codigo && MAESTRA.some(c => { const a = partesCodigo(c), b = partesCodigo(it.codigo); return a && b && a.prefijo === b.prefijo && a.num === b.num; });
        const repetido = items.some((o, j) => j !== k && o.codigo && o.codigo === it.codigo);
        return `<div class="campo ${dup || repetido ? 'invalido' : ''}" style="margin-top:16px"><label>${cursos.length > 1 ? esc(it.r.nombre) + ' · ' : ''}${esc(it.moneda)} <span class="req">serie ${it.moneda === 'Colones' ? '300' : '600'} · prefijo ${esc(pre)}</span></label>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input type="text" data-k="${k}" value="${esc(it.codigo)}" style="max-width:160px;text-transform:uppercase;font-weight:600">
          ${sug.map(s => `<button type="button" class="op ${s.codigo === it.codigo ? 'sel' : ''}" data-k="${k}" data-c="${esc(s.codigo)}"><span>${esc(s.codigo)}<small>${esc(s.etiqueta)}</small></span></button>`).join('')}</div>
          <div class="err" style="${dup || repetido ? 'display:flex' : ''}">${icon('alerta')}<span>${dup ? 'Ese código ya existe en la Plantilla Maestra.' : 'Código repetido en esta aprobación.'}</span></div></div>`;
      }).join('')}`;
    $$('input[data-k]', zona).forEach(i => i.addEventListener('change', () => { items[+i.dataset.k].codigo = i.value.toUpperCase().trim(); pintar(); }));
    $$('button[data-k]', zona).forEach(b => b.addEventListener('click', () => { items[+b.dataset.k].codigo = b.dataset.c; pintar(); }));
  };
  pintar();
  if(!MAESTRA) cargarMaestra().then(pintar).catch(() => {});
  return items;
}
function dialogoAprobar(cursos){
  const zona = document.createElement('div');
  zona.innerHTML = `<p style="margin:0;color:var(--tinta-2)">Se sugieren códigos consecutivos según la escuela y la moneda. Revíselos antes de aprobar.</p><div id="z"></div>`;
  const items = panelCodigos($('#z', zona), cursos);
  modal({ titulo:`Aprobar ${cursos.length} curso(s)`, ancho:true, cuerpo:zona, acciones:[{ texto:'Cancelar', valor:false }, { html:`${icon('check')}Aprobar y pasar a la Plantilla Maestra`, clase:'btn-primario', accion: async () => { const ok = await aprobarCursos(cursos, items); return ok ? true : false; } }] });
}
async function aprobarCursos(cursos, items){
  if(!MAESTRA){ try { await cargarMaestra(); } catch(e){ toast('Conecte primero la Plantilla Maestra.', 'error'); return false; } }
  const malos = items.filter(i => !partesCodigo(i.codigo));
  if(malos.length){ toast('Hay códigos vacíos o con formato no válido (ej. FUN-682).', 'error'); return false; }
  const set = new Set(); for(const i of items){ if(set.has(i.codigo)){ toast(`El código ${i.codigo} está repetido.`, 'error'); return false; } set.add(i.codigo); }
  const estadoPM = S.boot.correos.ESTADO_INICIAL_PM || 'EN PRODUCCIÓN';
  if(!await confirmar('Confirmar aprobación', `Se agregarán ${items.length} fila(s) a la Plantilla Maestra (${items.map(i => `<b>${esc(i.codigo)}</b>`).join(', ')}) con estado «${esc(estadoPM)}».`, 'Aprobar')) return false;
  espera('Pasando a la Plantilla Maestra…');
  let hechos = 0;
  try {
    for(const r of cursos){
      const mios = items.filter(i => i.r === r).map(i => ({ codigo:i.codigo, moneda:i.moneda }));
      Object.assign(r, await Almacen().aprobar(r, mios, estadoPM)); hechos++;
      mios.forEach(i => MAESTRA.push(i.codigo));
    }
    finEspera(); S.rev.sel = new Set();
    toast(`${hechos} curso(s) aprobados. Ya están en «Por notificar».`); pintarRevision(); return true;
  } catch(e){ finEspera(); modal({ titulo:'No se completó la aprobación', cuerpo:`<div class="alerta error">${icon('alerta')}<div>${esc(e.message)}</div></div><p class="nota">${hechos} curso(s) se aprobaron antes del error.</p>`, acciones:[{ texto:'Entendido', clase:'btn-primario' }] }); S.todos = null; MAESTRA = null; pintarRevision(); return false; }
}

/** Campo de correos como etiquetas: se escribe uno, Enter o «Añadir», y se quita con ×. El valor queda en un input oculto con id. */
function campoCorreos(id, label, valor, ayuda = '', porDefecto = null){
  return `<div class="campo" style="margin-top:14px"><label for="${id}-in">${label}</label>${ayuda ? `<p class="ayuda-c">${ayuda}</p>` : ''}
    <div class="chips-correo" data-def="${porDefecto ? esc(porDefecto.join(', ')) : ''}"><input type="hidden" id="${id}" value="${esc(valor.join(', '))}"><span class="lista-c"></span>
      <input type="text" inputmode="email" class="nuevo-c" id="${id}-in" placeholder="nombre@ucenfotec.ac.cr" autocomplete="off"><button type="button" class="btn btn-sm btn-suave add-c">${icon('mas')}Añadir</button></div>
    ${porDefecto && porDefecto.length ? `<div class="campo-c-acc"><button type="button" class="btn btn-sm btn-texto rest-c">Volver a los correos de la dirección</button></div>` : ''}</div>`;
}
const correoValido = c => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c);
function activarCorreos(raiz){
  $$('.chips-correo', raiz).forEach(box => {
    if(box._ok) return; box._ok = true;
    const oculto = $('input[type=hidden]', box), ent = $('.nuevo-c', box), lista = $('.lista-c', box);
    const pintar = () => {
      const v = listaCorreos(oculto.value);
      lista.innerHTML = v.length ? v.map(c => `<span class="chip-c">${esc(c)}<button type="button" data-q="${esc(c)}" title="Quitar ${esc(c)}" aria-label="Quitar ${esc(c)}">×</button></span>`).join('') : '<span class="vacio-c">Nadie todavía</span>';
      $$('[data-q]', lista).forEach(b => b.addEventListener('click', e => { e.stopPropagation(); oculto.value = listaCorreos(oculto.value).filter(x => x !== b.dataset.q).join(', '); pintar(); }));
    };
    const anadir = () => {
      const nuevos = listaCorreos(ent.value); if(!nuevos.length) return true;
      const malo = nuevos.find(c => !correoValido(c)); if(malo){ toast('Revise este correo: ' + malo, 'error'); return false; }
      oculto.value = [...new Set(listaCorreos(oculto.value).concat(nuevos))].join(', '); ent.value = ''; pintar(); return true;
    };
    ent.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ',' || e.key === ';'){ e.preventDefault(); anadir(); }
      else if(e.key === 'Backspace' && !ent.value){ const v = listaCorreos(oculto.value); v.pop(); oculto.value = v.join(', '); pintar(); }
    });
    ent.addEventListener('paste', () => setTimeout(anadir, 0));
    ent.addEventListener('blur', () => { if(ent.value.trim()) anadir(); });
    $('.add-c', box).addEventListener('click', () => { if(!ent.value.trim()){ ent.focus(); return; } anadir(); ent.focus(); });
    box.addEventListener('click', e => { if(e.target === box) ent.focus(); });
    const rest = box.parentElement.querySelector('.rest-c');
    if(rest) rest.addEventListener('click', () => { oculto.value = box.dataset.def; pintar(); });
    pintar();
  });
}

async function confirmarBorradores(lista){

}
async function redactarAvisos(sel){
  const C = S.boot.correos; const grupos = {};
  sel.forEach(r => (grupos[r.escuela] = grupos[r.escuela] || []).push(r));
  const escuelas = Object.keys(grupos); let enviados = 0; const borr = modoBorrador();
  for(let n = 0; n < escuelas.length; n++){
    const e = escuelas[n], cursos = grupos[e];
    const lineas = cursos.flatMap(r => r.codigoAsignado.split(/\s*,\s*/).map(cod => `${cod} ${r.nombre}`));
    const v = { saludo:saludo(), escuela:'Escuela de ' + e, cursos: lineas.join('\n'), cantidad:String(lineas.length), firma:firma() };
    const z = document.createElement('div');
    z.innerHTML = `${campoCorreos('a-para', 'Para', [...new Set(listaCorreos(C.AVISO_PARA_FIJOS).concat(destinosEscuela(e)))])}${campoCorreos('a-cc', 'Copia', listaCorreos(C.AVISO_CC_FIJOS))}
      <div class="campo" style="margin-top:14px"><label for="a-as">Asunto</label><input type="text" id="a-as" value="${esc(rellenar(C.AVISO_ASUNTO, v))}"></div>

    const res = await modal({ titulo:`Aviso ${n + 1} de ${escuelas.length} · ${e}`, ancho:true, cuerpo:z, acciones:[{ texto: n < escuelas.length - 1 ? 'Omitir esta escuela' : 'Omitir', valor:'omitir' }, { html:`${icon('correo')}${borr ? 'Guardar borrador en Gmail' : 'Enviar aviso'}`, clase:'btn-primario', valor:'ok', accion: async () => {
      const correo = { to: listaCorreos($('#a-para', z).value), cc: listaCorreos($('#a-cc', z).value), subject: $('#a-as', z).value, html: textoAHtml($('#a-msj', z).value) };
      if(!correo.to.length){ toast('Indique al menos un destinatario. Puede configurarlos en Revisión → Correos.', 'error', 6000); return false; }
      espera(borr ? 'Guardando borrador…' : 'Enviando aviso…');
      try { await Almacen().enviarCorreo(correo, borr); const f = (borr ? 'Borrador ' : '') + fechaTexto(new Date()); for(const r of cursos){ await Almacen().marcar(r, { notificado:f }); r.notificado = f; } finEspera(); enviados++; return true; }
      catch(err){ finEspera(); toast(err.message, 'error', 6000); return false; }
    } }] });
    if(res === null) break;
  }
  S.rev.sel = new Set();
  if(enviados) toast(borr ? `${enviados} aviso(s) guardados como borrador en Gmail. Revíselos y envíelos desde allí.` : `${enviados} aviso(s) enviados.`, '', 6000);
  pintarRevision();
}

function resolverItem(it){
  const reg = it.registroId && S.todos ? S.todos.find(r => r.id === it.registroId) : null;
  const pm = !it.nuevo && it.codigo && PM_CACHE ? PM_CACHE.find(c => c.codigo.toUpperCase() === it.codigo.toUpperCase()) : null;
  let horas = Number(it.horas) || 0;
  if(pm && Number(pm.horas)) horas = Number(pm.horas);
  if(reg){ const h = reg.horas === 'Otro' ? reg.horasOtro : reg.horas; if(Number(h)) horas = Number(h); }
  const codigo = reg && reg.codigoAsignado ? reg.codigoAsignado.split(/\s*,\s*/)[0] : (it.nuevo ? '' : it.codigo);
  let estado = 'maestra';
  if(it.nuevo) estado = !it.registroId ? 'pendiente' : !reg ? 'registrado' : ['Aprobado', 'Notificado', 'Aviso en borrador', 'Incluido'].includes(estadoDe(reg)) ? 'aprobado' : estadoDe(reg) === 'Con observaciones' ? 'observado' : 'revision';
  return { horas, creditos:creditosDe(horas), total:totalHorasDe(horas), codigo, reg, pm, estado };
}
function statsPlan(p){
  const items = (p.plan || []).filter(it => String(it.nombre || it.codigo || '').trim());
  let creditos = 0, horasClase = 0, horasTotales = 0, periodos = 0, pendientes = 0, revision = 0;
  items.forEach(it => { const r = resolverItem(it); creditos += r.creditos; horasClase += r.horas; horasTotales += r.total; periodos = Math.max(periodos, (+it.periodo || 1) + (+it.dura || 1) - 1);
    if(r.estado === 'pendiente') pendientes++; if(['registrado', 'revision', 'observado'].includes(r.estado)) revision++; });
  return { cursos:items.length, creditos, horasClase, horasTotales, periodos, semanas:periodos * 5, meses:Math.ceil(periodos * 5 / 4), pendientes, revision };
}
const ESCALA = [[0, 400], [400, 700, 'T1'], [700, 1200], [1200, 1600, 'T2'], [1600, 2300], [2300, 2800, 'T3'], [2800, 4500, 'T4 · T5']];
function posEscala(h){
  const n = ESCALA.length;
  for(let i = 0; i < n; i++){ const [a, b] = ESCALA[i]; if(h <= b || i === n - 1) return Math.min(100, (i + Math.min(1, Math.max(0, (h - a) / (b - a)))) / n * 100); }
  return 100;
}
function evaluarNivel(p, st){
  const h = st.horasTotales, obj = nivelMNC(p.nivel);
  const alcanzados = MNC.filter(n => h >= n.min && h <= (n.id === 'T4' ? n.max : n.max));
  const actual = alcanzados[0] || null;
  let estado = 'sin', msj = '';
  if(!obj){ msj = h ? `${fmtN(h)} horas totales · los programas profesionales no requieren un nivel del Marco.` : 'Agregue cursos para calcular las horas.'; estado = 'na'; }
  else if(!h) msj = `Agregue cursos: ${obj.nombre} pide ${obj.min === obj.max ? fmtN(obj.min) : fmtN(obj.min) + ' a ' + fmtN(obj.max)} horas totales.`;
  else if(h < obj.min){ estado = 'falta'; msj = `Faltan ${fmtN(obj.min - h)} h para llegar a ${obj.nombre}.`; }
  else if(h > obj.max){ estado = 'excede'; msj = `Supera en ${fmtN(h - obj.max)} h el máximo de ${obj.nombre}.`; }
  else { estado = 'ok'; msj = `Cumple el rango de horas de ${obj.nombre}.`; }

}

function planTexto(p){
  const items = (p.plan || []).filter(it => String(it.nombre || '').trim()).slice().sort((a, b) => a.periodo - b.periodo);
  return items.map(it => { const r = resolverItem(it); const req = it.req ? items.find(x => x.uid === it.req) : null;

async function guardarProg(p, silencio){
  const avisar = (p.plan || []).filter(it => it.nuevo && !it.registroId && it.asignado && it.asignado !== S.user.email && it.avisado !== it.asignado);
  if(!silencio) espera('Guardando…');
  try { await Almacen().guardarPrograma(p); }
  catch(e){ finEspera(); toast(e.message, 'error', 6000); return false; }
  PROGS = null;
  if(avisar.length){
    const porPersona = {}; avisar.forEach(it => (porPersona[it.asignado] = porPersona[it.asignado] || []).push(it));
    for(const correo of Object.keys(porPersona)){
      try { await Almacen().enviarCorreo(correoAsignacion(p, correo, porPersona[correo])); porPersona[correo].forEach(it => it.avisado = it.asignado); }
      catch(e){ console.warn('No se pudo avisar a', correo, e); }
    }
    try { await Almacen().guardarPrograma(p); } catch(e){}
    toast(`Se avisó por correo a ${Object.keys(porPersona).length} persona(s) con cursos por completar.`, '', 5000);
  }
  if(!silencio) finEspera();
  ls.del(claveProg());
  return true;
}

}
function refrescarMedidor(){ const p = S.prog && S.prog.p, m = $('#medidor'); if(p && m) m.innerHTML = htmlMedidor(p); }
function sugerenciasCurso(q, p){
  const t = norm(q); if(t.length < 2) return [];
  const pal = t.split(/\s+/).filter(Boolean);
  const pre = (S.boot.schools.find(s => s.nombre === p.escuela) || {}).prefijo;
  const ok = s => pal.every(w => s.includes(w));
  const pm = (PM_CACHE || []).filter(c => ok(norm(c.codigo + ' ' + c.nombre))).map(c => ({ fuente:'maestra', codigo:c.codigo, nombre:c.nombre, horas:Number(c.horas) || 16, escuela:c.escuela, inactivo:/inactivo/i.test(c.estado),
    peso:(c.escuela === p.escuela || (partesCodigo(c.codigo) || {}).prefijo === pre ? 0 : 2) + (/inactivo/i.test(c.estado) ? 3 : 0) + (norm(c.nombre).startsWith(t) || norm(c.codigo).startsWith(t) ? 0 : 1) }));
  const regs = (S.todos || []).filter(r => r.escuela === p.escuela && ['Pendiente', 'Con observaciones'].includes(estadoDe(r)) && ok(norm(r.nombre))).map(r => ({ fuente:'registro', id:r.id, codigo:'', nombre:r.nombre, horas:Number(r.horas === 'Otro' ? r.horasOtro : r.horas) || 16, escuela:r.escuela, peso:1 }));
  return regs.concat(pm).sort((a, b) => a.peso - b.peso || a.nombre.localeCompare(b.nombre, 'es')).slice(0, 8);
}
function activarFilaCurso(w, p){
  const it = p.plan.find(x => x.uid === w.dataset.uid); if(!it) return;
  const inp = $('.curso-in', w), lista = $('.ac-lista', w);
  let sug = [], idx = -1;
  const elegir = s => {
    if(s.fuente === 'maestra') Object.assign(it, { codigo:s.codigo, nombre:s.nombre, horas:s.horas, nuevo:false, registroId:'', asignado:'', otra:false });
    else Object.assign(it, { codigo:'', nombre:s.nombre, horas:s.horas, nuevo:true, registroId:s.id, asignado:'' });
    lista.hidden = true; pintarPlan(); borradorProg();
  };
  const mostrar = () => {
    sug = sugerenciasCurso(inp.value, p); idx = -1;
    if(!sug.length){ lista.hidden = true; return; }
    lista.innerHTML = sug.map((s, i) => `<button type="button" class="ac-op" data-i="${i}"><i class="punto" style="background:${esc(colorDe(s.escuela))}"></i><span class="ac-t"><b>${esc(s.nombre)}</b><small>${s.fuente === 'maestra' ? esc(s.codigo) + ' · ' + esc(s.escuela || '') : 'En revisión DCD · ' + esc(s.id)}${s.inactivo ? ' · inactivo' : ''}</small></span><span class="ac-h">${s.horas} h</span></button>`).join('')
      + `<div class="ac-pie">¿No está? Siga escribiendo y quedará como <b>curso nuevo</b>.</div>`;
    lista.hidden = false;
    $$('.ac-op', lista).forEach(b => b.addEventListener('mousedown', e => { e.preventDefault(); elegir(sug[+b.dataset.i]); }));
  };
  inp.addEventListener('input', () => {
    it.nombre = inp.value; if(it.codigo || it.registroId){ it.codigo = ''; it.registroId = ''; } it.nuevo = !!inp.value.trim();
    mostrar(); borradorProg();
    const meta = $('.c-meta', w); if(meta && it.nuevo) meta.innerHTML = `<span class="ori nuevo">${icon('mas')}Curso nuevo</span><span class="nota">Si ya existe, elíjalo de la lista</span>`;
  });
  inp.addEventListener('focus', () => { if(inp.value.trim() && !it.codigo) mostrar(); });
  inp.addEventListener('keydown', e => {
    if(lista.hidden) return;
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); idx = (idx + (e.key === 'ArrowDown' ? 1 : -1) + sug.length) % sug.length; $$('.ac-op', lista).forEach((b, i) => b.classList.toggle('act', i === idx)); }
    else if(e.key === 'Enter' && idx >= 0){ e.preventDefault(); elegir(sug[idx]); }
    else if(e.key === 'Escape') lista.hidden = true;
  });
  inp.addEventListener('blur', () => setTimeout(() => {
    lista.hidden = true;
    const v = inp.value.trim(); if(!v || it.codigo || it.registroId) return;
    const exacto = (PM_CACHE || []).find(c => norm(c.codigo) === norm(v) || norm(c.nombre) === norm(v));
    if(exacto){ elegir({ fuente:'maestra', codigo:exacto.codigo, nombre:exacto.nombre, horas:Number(exacto.horas) || 16, escuela:exacto.escuela }); return; }
    it.nuevo = true; pintarPlan();
  }, 120));
  $$('select[data-k]', w).forEach(s => s.addEventListener('change', () => { it[s.dataset.k] = s.value; borradorProg(); }));
  $$('.mo[data-h]', w).forEach(b => b.addEventListener('click', () => {
    if(b.dataset.h === 'otra'){ it.otra = true; pintarPlan(); borradorProg(); setTimeout(() => { const x = $(`.curso[data-uid="${it.uid}"] .mo-in`); if(x) x.focus(); }, 30); return; }
    it.otra = false; it.horas = +b.dataset.h; pintarPlan(); borradorProg();
  }));
  const hin = $('.mo-in', w);
  if(hin) hin.addEventListener('input', () => {
    const v = Math.round(+hin.value); if(!(v > 0)) return; it.horas = v;
    const r = resolverItem(it), c = $('.c-calc', w); if(c) c.innerHTML = `= <b>${fmtN(r.creditos)}</b> ${r.creditos === 1 ? 'crédito' : 'créditos'} · <b>${r.total}</b> horas totales`;
    refrescarMedidor(); borradorProg();
  });
  $$('.mo[data-d]', w).forEach(b => b.addEventListener('click', () => { it.dura = +b.dataset.d; pintarPlan(); borradorProg(); }));
  const mas = $('.c-mas', w); if(mas) mas.addEventListener('click', () => { MAS_OPC.has(it.uid) ? MAS_OPC.delete(it.uid) : MAS_OPC.add(it.uid); pintarPlan(); });
  $('.c-x', w).addEventListener('click', () => {
    p.plan = p.plan.filter(x => x.uid !== it.uid); p.plan.forEach(x => { if(x.req === it.uid) x.req = ''; });
    if(!p.plan.length) p.plan.push(itemNuevo(1));
    // Cierra huecos: los periodos quedan seguidos
    const pers = [...new Set(p.plan.map(x => +x.periodo || 1))].sort((a, b) => a - b); const mapa = {}; let n = 1;
    pers.forEach(q => { mapa[q] = n; const larga = Math.max(...p.plan.filter(x => +x.periodo === q).map(x => +x.dura || 1)); n += larga; });
    p.plan.forEach(x => x.periodo = mapa[+x.periodo || 1]);
    pintarPlan(); borradorProg();
  });
}

/* ---------- Propuesta de cursos con IA (CSV de la Plantilla Maestra + prompt + JSON) ---------- */
function csvMaestra(){
  const cel = v => `"${String(v == null ? '' : v).replace(/"/g, '""').replace(/\s+/g, ' ').trim()}"`;
  const filas = (PM_CACHE || []).filter(c => !/inactivo|descartado/i.test(c.estado)).map(c => [c.codigo, c.nombre, c.escuela, c.horas, c.nivel, c.moneda, String(c.desc || '').slice(0, 220)]);
  return [['Código', 'Nombre', 'Escuela', 'Horas lectivas', 'Nivel', 'Moneda', 'Descripción']].concat(filas).map(f => f.map(cel).join(',')).join('\r\n');
}
function promptPlan(p){
  const n = nivelMNC(p.nivel);
  return `Actúa como especialista en diseño curricular de la Universidad CENFOTEC (Costa Rica).
Te adjunto el archivo CSV «plantilla_maestra.csv» con los microcursos vigentes (código, nombre, escuela, horas lectivas, nivel, moneda y descripción).

Necesito una propuesta de plan de estudios para este programa:
- Nombre: ${p.nombre || '(sin nombre)'}
- Tipo: ${tipoTxt(p)}
- Escuela: ${p.escuela}
- Nivel buscado: ${n ? `${n.nombre} del Marco Nacional de Cualificaciones (${n.min === n.max ? n.min : n.min + ' a ' + n.max} horas totales)` : 'sin nivel del Marco'}
${p.tematicas ? `- Temáticas: ${p.tematicas}\n` : ''}${p.descripcion ? `- Descripción: ${p.descripcion}\n` : ''}
Cómo se calculan las horas:
- Créditos por horas lectivas: menos de 16 h = 0,5; de 16 a 23 h = 1; de 24 a 31 h = 1,5; de 32 a 39 h = 2; y así, medio crédito más cada 8 horas.
- Horas totales de un curso = créditos × 45 (ej. 16 horas lectivas = 1 crédito = 45 horas totales).
- Cada periodo dura 5 semanas. Varios cursos pueden ir en el mismo periodo (en paralelo) y un curso largo puede durar 2 periodos.

Reglas:
1. Usa primero cursos existentes del CSV, sobre todo de la escuela ${p.escuela}, copiando el código y el nombre exactamente.
2. Si hace falta un curso que no existe, propónlo con "nuevo": true, un nombre claro y sus horas lectivas (16, 24 o 32).
3. Ordena los cursos de lo básico a lo avanzado e indica el requisito con el código (o el nombre si es nuevo) de un curso anterior, si aplica.
4. Ajusta la cantidad de cursos para que las horas totales queden dentro del rango del nivel buscado.
5. Responde SOLO con un JSON válido, sin explicaciones, con esta forma:

{
  "plan": [
    { "periodo": 1, "codigo": "FUN-600", "nombre": "Nombre exacto del curso", "horas_lectivas": 16, "nuevo": false, "duracion_periodos": 1, "requisito": "" }
  ]
}`;
}

      if(pm) Object.assign(it, { codigo:pm.codigo, nombre:pm.nombre, horas:Number(pm.horas) || 16, nuevo:false });

  const st = statsPlan(p), n = nivelMNC(p.nivel) || MNC_SIN;

    return cods.map((cod, i) => { const q = partesCodigo(cod); const e = ESCUELAS_DEFECTO.find(x => x[2] === q.prefijo);
      return { escuela: e ? e[0] : '', codigo: cod, nombre: `${temas[(i * 7) % temas.length]} ${objetos[i % objetos.length]}`, estado: i % 9 === 0 ? 'INACTIVO' : 'EN PRODUCCIÓN', horas: ['16','24','32'][i % 3], moneda: q.num < 600 ? 'Colones' : 'Dólares', nivel: ['Básico','Intermedio','Avanzado'][i % 3], desc:'', reqInd:'Sin requisitos', programas:'' }; }); },

};
