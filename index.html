function cursoDesdeJSON(o){
  const t = v => Array.isArray(v) ? v.join(', ') : v == null ? '' : typeof v === 'object' ? '' : String(v);
  const g = (...ks) => { for(const k of ks){ const key = Object.keys(o).find(x => norm(x).replace(/[\s_-]/g, '') === k); if(key !== undefined) return o[key]; } return ''; };
  const cert = g('certificacion') || {};
  const asigna = g('asignadcd');
  const f = {
    escuela: t(g('escuela')), asignaDCD: asigna === false || /^(no|false)$/i.test(String(asigna)) ? 'No' : (asigna === '' ? '' : 'Sí'), codigo: t(g('codigopropuesto', 'codigo')),
    nombre: t(g('nombre', 'nombredelcurso')), moneda: (Array.isArray(g('moneda')) ? g('moneda') : [g('moneda')]).join(' y '), horas: t(g('horaslectivas', 'horas')), modalidad: t(g('modalidad')),
    descripcion: t(g('descripcion')), nivel: t(g('nivel', 'niveldecomplejidad')), perfil: t(g('perfilingreso', 'perfildeingreso', 'perfil')),
    reqInd: t(g('requisitosindispensables')), reqDes: t(g('requisitosdeseables')), software: t(g('softwarerequerido', 'software')), equipo: t(g('equipotecnologico', 'equipo')),
    roles: t(g('roles')), palabras: t(g('palabrasclave')), contenidos: Array.isArray(g('contenidos')) ? g('contenidos').join('\n') : t(g('contenidos')),
    cert: typeof cert === 'object' ? (cert.tiene === true || /^(si|sí|true)$/i.test(String(cert.tiene)) ? 'Sí' : 'No') : t(cert),
    certCasa: typeof cert === 'object' ? t(cert.casa_certificadora || cert.casa) : '', certLink: typeof cert === 'object' ? t(cert.enlace) : '',
    programa: t(g('enlaceprograma', 'programa'))
  };
  return cursoDesdeFila(f);
}

function cursoDesdeFila(f){
  const c = cursoNuevo(S.school ? S.school.nombre : '');
  const sn = v => { const n = norm(v); return /^(si|s|yes|x|true)$/.test(n) ? 'Sí' : /^(no|n|false)$/.test(n) ? 'No' : ''; };
  const ning = v => !v || /^(ninguno|ninguna|n\/?a|no aplica|-|—|no)$/i.test(norm(v));
  if(f.escuela){ const m = S.boot.schools.find(s => norm(s.nombre) === norm(f.escuela)); c.escuela = m ? m.nombre : f.escuela; }
  c.codigo = (f.codigo || '').toUpperCase(); c.asignaDCD = sn(f.asignaDCD) || (c.codigo ? 'No' : 'Sí'); c.nombre = f.nombre || '';
  c.moneda = MONEDAS.filter(m => norm(f.moneda).includes(norm(m)));
  const mo = norm(f.modalidad || ''); c.modalidad = /presen/.test(mo) ? 'Presencial' : /hibri/.test(mo) ? 'Híbrida' : MODALIDAD_DEFECTO;
  const hn = Math.round(Number(String(f.horas || '').replace(/[^\d.,]/g, '').replace(',', '.')));
  if(hn > 0){ if(['16','24','32'].includes(String(hn))) c.horas = String(hn); else { c.horas = 'Otro'; c.horasOtro = String(hn); } }
  ['descripcion','perfil','roles','palabras','contenidos','programa','certCasa','certLink'].forEach(k => c[k] = f[k] || '');
  c.nivel = NIVELES.find(n => norm(n) === norm(f.nivel)) || '';
  TOGGLES.forEach(k => { const v = f[k] || ''; c[k + 'On'] = !ning(v); c[k] = ning(v) ? '' : v; });
  c.cert = sn(f.cert) || (c.certCasa ? 'Sí' : 'No');
  return c;
}

/** Dibuja, para cada curso y moneda, el campo del código con sugerencias. Devuelve la lista de ítems editables. */
function panelCodigos(zona, cursos){
  const items = [];
  cursos.forEach(r => (r.moneda.length ? r.moneda : ['Dólares']).forEach(m => items.push({ r, moneda:m, codigo:'' })));
  const pintar = () => {
    const ocupados = new Set((MAESTRA || []).concat(items.map(i => i.codigo).filter(Boolean)));
    const enSerie = (cod, moneda) => { const q = partesCodigo(cod); return q && (moneda === 'Colones' ? q.num >= 300 && q.num < 600 : q.num >= 600); };
    zona.innerHTML = `<div class="bloque-tit primero">Código en la Plantilla Maestra</div>
      ${!MAESTRA ? '<p class="nota" style="margin:14px 0 0">Conecte la Plantilla Maestra para ver sugerencias y validar códigos.</p>' : ''}
      ${items.map((it, k) => {
        const pre = prefijo(it.r.escuela);
        const sug = MAESTRA ? sugerirCodigos(pre, it.moneda, new Set([...ocupados].filter(c => c !== it.codigo))) : [];
        const prop = String(it.r.codigo || '').toUpperCase().trim();
        if(it.r.asignaDCD === 'No' && prop && enSerie(prop, it.moneda) && !sug.some(s => s.codigo === prop)) sug.unshift({ codigo: prop, etiqueta:'Propuesto por la escuela' });
        if(!it.codigo && sug.length){ it.codigo = (sug.find(x => !ocupados.has(x.codigo)) || sug[0]).codigo; ocupados.add(it.codigo); }
        const dup = MAESTRA && it.codigo && MAESTRA.some(c => { const a = partesCodigo(c), b = partesCodigo(it.codigo); return a && b && a.prefijo === b.prefijo && a.num === b.num; });
        const repetido = items.some((o, j) => j !== k && o.codigo && o.codigo === it.codigo);
        return `<div class="campo ${dup || repetido ? 'invalido' : ''}" style="margin-top:16px"><label>${cursos.length > 1 ? esc(it.r.nombre) + ' · ' : ''}${esc(it.moneda)} <span class="req">serie ${it.moneda === 'Colones' ? '300' : '600'} · prefijo ${esc(pre)}</span></label>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input type="text" data-k="${k}" value="${esc(it.codigo)}" style="max-width:160px;text-transform:uppercase;font-weight:600">
          ${sug.map(s => `<button type="button" class="op ${s.codigo === it.codigo ? 'sel' : ''}" data-k="${k}" data-c="${esc(s.codigo)}"><span>${esc(s.codigo)}<small>${esc(s.etiqueta)}</small></span></button>`).join('')}</div>
          <div class="err" style="${dup || repetido ? 'display:flex' : ''}">${icon('alerta')}<span>${dup ? 'Ese código ya existe en la Plantilla Maestra.' : 'Código repetido en esta aprobación.'}</span></div></div>`;
      }).join('')}`;
    $$('input[data-k]', zona).forEach(i => i.addEventListener('change', () => { items[+i.dataset.k].codigo = i.value.toUpperCase().trim(); pintar(); }));
    $$('button[data-k]', zona).forEach(b => b.addEventListener('click', () => { items[+b.dataset.k].codigo = b.dataset.c; pintar(); }));
  };
  pintar();
  if(!MAESTRA) cargarMaestra().then(pintar).catch(() => {});
  return items;
}
function dialogoAprobar(cursos){
  const zona = document.createElement('div');
  zona.innerHTML = `<p style="margin:0;color:var(--tinta-2)">Se sugieren códigos consecutivos según la escuela y la moneda. Revíselos antes de aprobar.</p><div id="z"></div>`;
  const items = panelCodigos($('#z', zona), cursos);
  modal({ titulo:`Aprobar ${cursos.length} curso(s)`, ancho:true, cuerpo:zona, acciones:[{ texto:'Cancelar', valor:false }, { html:`${icon('check')}Aprobar y pasar a la Plantilla Maestra`, clase:'btn-primario', accion: async () => { const ok = await aprobarCursos(cursos, items); return ok ? true : false; } }] });
}
async function aprobarCursos(cursos, items){
  if(!MAESTRA){ try { await cargarMaestra(); } catch(e){ toast('Conecte primero la Plantilla Maestra.', 'error'); return false; } }
  const malos = items.filter(i => !partesCodigo(i.codigo));
  if(malos.length){ toast('Hay códigos vacíos o con formato no válido (ej. FUN-682).', 'error'); return false; }
  const set = new Set(); for(const i of items){ if(set.has(i.codigo)){ toast(`El código ${i.codigo} está repetido.`, 'error'); return false; } set.add(i.codigo); }
  const estadoPM = S.boot.correos.ESTADO_INICIAL_PM || 'EN PRODUCCIÓN';
  if(!await confirmar('Confirmar aprobación', `Se agregarán ${items.length} fila(s) a la Plantilla Maestra (${items.map(i => `<b>${esc(i.codigo)}</b>`).join(', ')}) con estado «${esc(estadoPM)}».`, 'Aprobar')) return false;
  espera('Pasando a la Plantilla Maestra…');
  let hechos = 0;
  try {
    for(const r of cursos){
      const mios = items.filter(i => i.r === r).map(i => ({ codigo:i.codigo, moneda:i.moneda }));
      Object.assign(r, await Almacen().aprobar(r, mios, estadoPM)); hechos++;
      mios.forEach(i => MAESTRA.push(i.codigo));
    }
    finEspera(); S.rev.sel = new Set();
    toast(`${hechos} curso(s) aprobados. Ya están en «Por notificar».`); pintarRevision(); return true;
  } catch(e){ finEspera(); modal({ titulo:'No se completó la aprobación', cuerpo:`<div class="alerta error">${icon('alerta')}<div>${esc(e.message)}</div></div><p class="nota">${hechos} curso(s) se aprobaron antes del error.</p>`, acciones:[{ texto:'Entendido', clase:'btn-primario' }] }); S.todos = null; MAESTRA = null; pintarRevision(); return false; }
}

/** Quita cursos de pendientes sin borrarlos: quedan como completos en el registro de códigos, con el motivo. */
function dialogoEliminar(cursos){
  const z = document.createElement('div');

/** Campo de correos como etiquetas: se escribe uno, Enter o «Añadir», y se quita con ×. El valor queda en un input oculto con id. */
function campoCorreos(id, label, valor, ayuda = '', porDefecto = null){
  return `<div class="campo" style="margin-top:14px"><label for="${id}-in">${label}</label>${ayuda ? `<p class="ayuda-c">${ayuda}</p>` : ''}
    <div class="chips-correo" data-def="${porDefecto ? esc(porDefecto.join(', ')) : ''}"><input type="hidden" id="${id}" value="${esc(valor.join(', '))}"><span class="lista-c"></span>
      <input type="text" inputmode="email" class="nuevo-c" id="${id}-in" placeholder="nombre@ucenfotec.ac.cr" autocomplete="off"><button type="button" class="btn btn-sm btn-suave add-c">${icon('mas')}Añadir</button></div>
    ${porDefecto && porDefecto.length ? `<div class="campo-c-acc"><button type="button" class="btn btn-sm btn-texto rest-c">Volver a los correos de la dirección</button></div>` : ''}</div>`;
}
const correoValido = c => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c);
function activarCorreos(raiz){
  $$('.chips-correo', raiz).forEach(box => {
    if(box._ok) return; box._ok = true;
    const oculto = $('input[type=hidden]', box), ent = $('.nuevo-c', box), lista = $('.lista-c', box);
    const pintar = () => {
      const v = listaCorreos(oculto.value);
      lista.innerHTML = v.length ? v.map(c => `<span class="chip-c">${esc(c)}<button type="button" data-q="${esc(c)}" title="Quitar ${esc(c)}" aria-label="Quitar ${esc(c)}">×</button></span>`).join('') : '<span class="vacio-c">Nadie todavía</span>';
      $$('[data-q]', lista).forEach(b => b.addEventListener('click', e => { e.stopPropagation(); oculto.value = listaCorreos(oculto.value).filter(x => x !== b.dataset.q).join(', '); pintar(); }));
    };
    const anadir = () => {
      const nuevos = listaCorreos(ent.value); if(!nuevos.length) return true;
      const malo = nuevos.find(c => !correoValido(c)); if(malo){ toast('Revise este correo: ' + malo, 'error'); return false; }
      oculto.value = [...new Set(listaCorreos(oculto.value).concat(nuevos))].join(', '); ent.value = ''; pintar(); return true;
    };
    ent.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ',' || e.key === ';'){ e.preventDefault(); anadir(); }
      else if(e.key === 'Backspace' && !ent.value){ const v = listaCorreos(oculto.value); v.pop(); oculto.value = v.join(', '); pintar(); }
    });
    ent.addEventListener('paste', () => setTimeout(anadir, 0));
    ent.addEventListener('blur', () => { if(ent.value.trim()) anadir(); });
    $('.add-c', box).addEventListener('click', () => { if(!ent.value.trim()){ ent.focus(); return; } anadir(); ent.focus(); });
    box.addEventListener('click', e => { if(e.target === box) ent.focus(); });
    const rest = box.parentElement.querySelector('.rest-c');
    if(rest) rest.addEventListener('click', () => { oculto.value = box.dataset.def; pintar(); });
    pintar();
  });
}

function colaAvisos(cont, notif){
  const R = S.rev;
  if(!notif.length){ cont.innerHTML = '<div class="vacio">No hay cursos aprobados pendientes de aviso.</div>'; return; }
  const grupos = {}; notif.forEach(r => (grupos[r.escuela] = grupos[r.escuela] || []).push(r));
  cont.innerHTML = Object.keys(grupos).map(e => `<div class="equipo-grupo"><h2><input type="checkbox" data-g="${esc(e)}" style="accent-color:var(--azul)"><i class="punto" style="background:${esc(colorDe(e))}"></i>${esc(e)} <span class="nota">· ${grupos[e].length} curso(s)</span></h2>
    <div class="lista">${grupos[e].map(r => `<label class="fila" style="cursor:pointer"><input type="checkbox" data-s="${esc(r.id)}" ${R.sel.has(r.id) ? 'checked' : ''} style="accent-color:var(--azul)"><div class="txt"><b>${esc(r.codigoAsignado)} ${esc(r.nombre)}</b><span class="sec">Aprobado ${esc(r.fechaRevision)} por ${esc(r.revisadoPor)}</span></div></label>`).join('')}</div></div>`).join('')
    + `<div class="pie-fijo"><span class="nota" id="n-sel"></span><span class="esp"></span><button class="btn btn-suave" id="marcar">Marcar como avisados</button><button class="btn btn-primario" id="redactar">${icon('correo')}Redactar aviso</button></div>`;
  const act = () => { $('#n-sel').textContent = `${R.sel.size} seleccionado(s)`; $('#redactar').disabled = $('#marcar').disabled = !R.sel.size; };
  $$('[data-s]', cont).forEach(cb => cb.addEventListener('change', () => { cb.checked ? R.sel.add(cb.dataset.s) : R.sel.delete(cb.dataset.s); act(); }));
  $$('[data-g]', cont).forEach(cb => cb.addEventListener('change', () => { grupos[cb.dataset.g].forEach(r => { cb.checked ? R.sel.add(r.id) : R.sel.delete(r.id); const x = $(`[data-s="${r.id}"]`, cont); if(x) x.checked = cb.checked; }); act(); }));
  $('#redactar').addEventListener('click', () => redactarAvisos(notif.filter(r => R.sel.has(r.id))));
  $('#marcar').addEventListener('click', async () => {
    const sel = notif.filter(r => R.sel.has(r.id));
    if(!await confirmar('Marcar como avisados', `Se marcarán ${sel.length} curso(s) como avisados sin enviar correo.`, 'Marcar')) return;
    espera('Guardando…'); try { for(const r of sel){ const f = fechaTexto(new Date()); await Almacen().marcar(r, { notificado:f }); r.notificado = f; } R.sel = new Set(); finEspera(); pintarRevision(); } catch(e){ finEspera(); toast(e.message, 'error'); }
  });
  act();
}
async function redactarAvisos(sel){
  const C = S.boot.correos; const grupos = {};
  sel.forEach(r => (grupos[r.escuela] = grupos[r.escuela] || []).push(r));
  const escuelas = Object.keys(grupos); let enviados = 0; const borr = modoBorrador();
  for(let n = 0; n < escuelas.length; n++){
    const e = escuelas[n], cursos = grupos[e];
    const lineas = cursos.flatMap(r => r.codigoAsignado.split(/\s*,\s*/).map(cod => `${cod} ${r.nombre}`));
    const v = { saludo:saludo(), escuela:'Escuela de ' + e, cursos: lineas.join('\n'), cantidad:String(lineas.length), firma:firma() };
    const z = document.createElement('div');
    z.innerHTML = `${campoCorreos('a-para', 'Para', [...new Set(listaCorreos(C.AVISO_PARA_FIJOS).concat(destinosEscuela(e)))])}${campoCorreos('a-cc', 'Copia', listaCorreos(C.AVISO_CC_FIJOS))}
      <div class="campo" style="margin-top:14px"><label for="a-as">Asunto</label><input type="text" id="a-as" value="${esc(rellenar(C.AVISO_ASUNTO, v))}"></div>

    const res = await modal({ titulo:`Aviso ${n + 1} de ${escuelas.length} · ${e}`, ancho:true, cuerpo:z, acciones:[{ texto: n < escuelas.length - 1 ? 'Omitir esta escuela' : 'Omitir', valor:'omitir' }, { html:`${icon('correo')}${borr ? 'Guardar borrador en Gmail' : 'Enviar aviso'}`, clase:'btn-primario', valor:'ok', accion: async () => {
      const correo = { to: listaCorreos($('#a-para', z).value), cc: listaCorreos($('#a-cc', z).value), subject: $('#a-as', z).value, html: textoAHtml($('#a-msj', z).value) };
      if(!correo.to.length){ toast('Indique al menos un destinatario. Puede configurarlos en Revisión → Correos.', 'error', 6000); return false; }
      espera(borr ? 'Guardando borrador…' : 'Enviando aviso…');
      try { await Almacen().enviarCorreo(correo, borr); const f = (borr ? 'Borrador ' : '') + fechaTexto(new Date()); for(const r of cursos){ await Almacen().marcar(r, { notificado:f }); r.notificado = f; } finEspera(); enviados++; return true; }
      catch(err){ finEspera(); toast(err.message, 'error', 6000); return false; }
    } }] });
    if(res === null) break;
  }
  S.rev.sel = new Set();
  if(enviados) toast(borr ? `${enviados} aviso(s) guardados como borrador en Gmail. Revíselos y envíelos desde allí.` : `${enviados} aviso(s) enviados.`, '', 6000);
  pintarRevision();
}

      <td><input type="checkbox" data-i="${i}" data-k="activa" ${s.activa ? 'checked' : ''} style="accent-color:var(--azul);width:17px;height:17px"></td></tr>`).join('')}</tbody></table></div>`;
    $$('#escs [data-k]').forEach(el => el.addEventListener('input', () => { const s = esc_[+el.dataset.i], k = el.dataset.k;
      s[k] = k === 'activa' ? el.checked : k === 'correos' ? listaCorreos(el.value) : k === 'prefijo' ? el.value.toUpperCase().trim() : el.value; }));
  };
  pintarEsc();
  $('#add-esc').addEventListener('click', () => { esc_.push({ nombre:'', color:'#7C7B75', prefijo:'', correos:[], activa:true }); pintarEsc(); });
  $('#g-esc').addEventListener('click', async () => {
    const lista = esc_.filter(s => s.nombre.trim()); if(lista.some(s => !s.prefijo)){ toast('Cada escuela necesita un prefijo.', 'error'); return; }
    espera('Guardando escuelas…'); try { await Almacen().guardarEscuelas(lista); b.schools = lista.filter(s => s.activa); finEspera(); toast('Escuelas guardadas.'); } catch(e){ finEspera(); toast(e.message, 'error'); }
  });
  $('#g-adm').addEventListener('click', async () => {
    const admins = [...new Set(listaCorreos($('#adm').value).concat(listaCorreos(CFG.ADMIN_INICIAL)))];
    if(!admins.includes(S.user.email) && !await confirmar('Quitarse como administrador', 'Su correo no está en la lista: perderá el acceso a esta sección.', 'Continuar', true)) return;
    espera('Guardando…');
    try { await Almacen().guardarConfig({ ADMINISTRADORES: admins.join(', ') }); await Almacen().protecciones(admins); await Almacen().compartirAdmins(admins.filter(a => a !== S.user.email));
      cfg.ADMINISTRADORES = admins.join(', '); b.admins = admins; finEspera(); toast('Administradores guardados.'); $('#adm').value = admins.join('\n'); }
    catch(e){ finEspera(); toast(e.message, 'error'); }
  });
  $('#g-gen').addEventListener('click', async () => {
    const pares = { NOTIFICAR_A: listaCorreos($('#n-a').value).join(', '), ASUNTO_DEL_CORREO: $('#n-as').value, MENSAJE_DEL_CORREO: $('#n-msj').value, MENSAJE_DE_EXITO: $('#n-ex').value,
      SOLO_PERSONAS_REGISTRADAS: $('#o-solo').checked ? 'Sí' : 'No', PERMITIR_OTRAS_ESCUELAS: $('#o-otras').checked ? 'Sí' : 'No' };
    espera('Guardando…'); try { await Almacen().guardarConfig(pares); Object.assign(cfg, pares); b.to = [...new Set(listaCorreos(pares.NOTIFICAR_A).concat(b.revisores))]; b.exito = pares.MENSAJE_DE_EXITO || b.exito; finEspera(); toast('Configuración guardada.'); } catch(e){ finEspera(); toast(e.message, 'error'); }
  });
}

    schools: d.escuelas || ESCUELAS_DEFECTO.map(e => ({ nombre:e[0], color:e[1], prefijo:e[2], correos:['direccion.' + e[2].toLowerCase() + '@ejemplo.com'], activa:true })), equipo: d.equipo, correos }; },
  async preparar(){},
  async todos(){ await sleep(200); return Demo.datos().registros; },
  async registrar(cursos, origen){ await sleep(500); const d = Demo.datos(); const f = new Date().toISOString();
    const recs = cursos.map(c => ({ id:nuevoId(), fecha:f, nombre:c.nombre, escuela:c.escuela }));
    cursos.forEach((c, i) => d.registros.unshift(Object.assign({}, c, recs[i], { included:false, correo:S.user.email, registradoPor:S.user.name, origen }))); Demo.guardar(d); return recs; },
  async actualizar(r, c){ const d = Demo.datos(); const i = d.registros.findIndex(x => x.id === r.id); d.registros[i] = Object.assign({}, d.registros[i], c); Demo.guardar(d); return d.registros[i]; },
  async incluido(r, v){ const d = Demo.datos(); d.registros.find(x => x.id === r.id).included = v; Demo.guardar(d); },
  async agregarPersona(p){ await sleep(400); const d = Demo.datos(); d.equipo.push(Object.assign({ activo:true, agregadoPor:S.user.email }, p)); Demo.guardar(d); return { compartido:true }; },
  async editarPersona(m, n){ await sleep(300); const d = Demo.datos(); const x = d.equipo.find(y => y.correo === m.correo && y.escuela === m.escuela); Object.assign(x, n); Demo.guardar(d); return {}; },

  async enviarCorreo(){ await sleep(400); },

  async maestraCodigos(){ await sleep(150); const d = Demo.datos(); if(!d.maestra){ d.maestra = [];

  async aprobar(r, items){ await sleep(500); const d = Demo.datos(); d.maestra = (d.maestra || []).concat(items.map(i => i.codigo));

  async guardarEscuelas(l){ const d = Demo.datos(); d.escuelas = l; Demo.guardar(d); },
  async protecciones(){}, async compartirAdmins(){}, async bitacora(){},
  async maestraCursos(){ const cods = await Demo.maestraCodigos(); const temas = ['Fundamentos de','Introducción a','Taller de','Gestión de','Análisis de','Bases de','Diseño de','Herramientas de','Laboratorio de','Ética en','Modelado de','Programación en','Redes y','Ciencia de','Ultra práctica en','Visualización de','Kotlin para','Java para','Python para','Zero Trust en','Nube en','Usabilidad en','Robótica en','Ofimática en','Ventas en','Química de'];

      return { escuela: e ? e[0] : '', codigo: cod, nombre: `${temas[(i * 7) % temas.length]} ${objetos[i % objetos.length]}`, estado: i % 9 === 0 ? 'INACTIVO' : 'EN PRODUCCIÓN', horas: ['16','24','32'][i % 3], moneda: q.num < 600 ? 'Colones' : 'Dólares', nivel: ['Básico','Intermedio','Avanzado'][i % 3], desc:'' }; }); }
};
